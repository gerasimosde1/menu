<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0A0D11">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forno – Pizzeria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0A0D11;--surface:#11161C;--ink:#EDEAE3;--mute:#85909A;--gold:#D9B877;--gold2:#F0D9A4;--line:#1D252D}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
/* language picker */
.lg{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:15;display:flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--line);border-radius:99px;background:rgba(10,13,17,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);font:700 12px Manrope,sans-serif;letter-spacing:.1em;cursor:pointer}
.lg svg{width:15px;height:15px}
.lgbox{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));right:14px;z-index:16;width:min(300px,calc(100vw - 28px));display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 18px 50px rgba(0,0,0,.55);animation:pop .22s ease}
.lgbox[hidden]{display:none}
.lgbox button{padding:11px 12px;border:0;border-radius:11px;background:none;color:var(--ink);font:600 14px Manrope,sans-serif;text-align:left;cursor:pointer}
.lgbox button[aria-selected="true"]{background:var(--gold);color:#17110A}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
/* hero */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 28px 110px;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(60% 42% at 50% 34%,rgba(217,184,119,.15),transparent 70%);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.hc{position:relative;max-width:420px;will-change:transform,opacity}
.eyebrow{margin:0 0 16px;font:700 11px Manrope,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);opacity:0;animation:rise .9s .1s forwards}
.hc h1{margin:0;font:400 clamp(56px,17vw,84px)/1 Literata,Georgia,serif;letter-spacing:-.02em;opacity:0;animation:rise .9s .25s forwards}
.rule{height:1px;width:0;margin:26px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:grow 1.2s .6s forwards}
@keyframes grow{to{width:140px}}
.intro{margin:0;color:var(--mute);font-size:16px;line-height:1.6;opacity:0;animation:rise .9s .8s forwards}
.chip{display:inline-flex;align-items:center;gap:5px;margin:0 2px;padding:1px 9px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font:700 10.5px Manrope,sans-serif;letter-spacing:.12em;vertical-align:1px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cue{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--gold2);font:700 14px Manrope,sans-serif;letter-spacing:.28em;text-transform:uppercase;cursor:pointer;opacity:0;animation:rise .9s 1.3s forwards}
.arrows{display:flex;flex-direction:column;align-items:center;gap:0}
.arrows svg{width:30px;height:17px;margin-top:-5px;opacity:0;animation:wave 1.7s ease-in-out infinite}
.arrows svg:nth-child(2){animation-delay:.22s}.arrows svg:nth-child(3){animation-delay:.44s}
@keyframes wave{0%{opacity:0;transform:translateY(-6px)}45%{opacity:1}100%{opacity:0;transform:translateY(8px)}}
/* menu */
.wrap{max-width:580px;margin:0 auto;padding:36px 22px 80px}
h2{font:600 13px Manrope,sans-serif;letter-spacing:.28em;text-transform:uppercase;margin:52px 0 6px;color:var(--gold)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.dish{display:flex;width:100%;gap:16px;align-items:flex-start;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:24px 0;margin:0;color:inherit;font:inherit;cursor:pointer}
.dish .t{flex:1;min-width:0}
.dish b{display:block;font:500 24px/1.25 Literata,Georgia,serif}
.dish small{display:block;color:var(--mute);font-size:15.5px;line-height:1.45;margin-top:4px}
.dish .tag{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:2px 9px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font:700 11px Manrope,sans-serif;letter-spacing:.14em}
.price{font:400 21px Literata,Georgia,serif;white-space:nowrap;color:var(--gold2);padding-top:3px}
/* sheet */
body.lock{position:fixed;width:100%;overflow:hidden}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{position:relative;background:var(--surface);width:100%;max-width:520px;max-height:93%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:28px 28px 0 0;border-top:1px solid rgba(217,184,119,.35);padding:0 22px calc(28px + env(safe-area-inset-bottom,0px));animation:up .38s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
.bar{position:sticky;top:0;z-index:3;display:flex;justify-content:center;padding:12px 0 14px;margin:0 -22px;background:linear-gradient(var(--surface) 65%,rgba(17,22,28,0))}
.grab{width:44px;height:4px;border-radius:4px;background:#2A343D}
.x{position:absolute;right:16px;top:8px;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--ink);cursor:pointer}
.x svg{width:16px;height:16px}
.panel h3{font:400 34px/1.1 Literata,Georgia,serif;margin:6px 0 8px}
.panel p{margin:0 0 6px;color:var(--mute)}
.bd{--s:34px;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border:1px solid var(--gold);border-radius:50%;background:var(--surface);color:var(--gold2);flex:none}
.bd svg{width:62%;height:62%;overflow:visible}
.tags{display:flex;flex-wrap:wrap;gap:12px 10px;margin:16px 0 2px}
.tags figure{margin:0;width:72px;text-align:center;font-size:10.5px;line-height:1.25;color:var(--mute)}
.tags figure .bd{display:grid;margin:0 auto 7px}
model-viewer{display:block;width:100%;height:2px;margin-top:0;opacity:0;background:transparent;--poster-color:transparent;transition:height .35s,opacity .35s,margin .35s}
model-viewer.ok{height:300px;margin-top:12px;opacity:1}
.pills{display:flex;gap:8px;margin:14px 0 4px}
.pill{flex:1;padding:10px 8px;border:1px solid var(--gold);border-radius:99px;background:none;color:var(--gold2);font:700 12.5px Manrope,sans-serif;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--gold);color:#17110A}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin:16px 0 6px}
.facts div{padding:12px 0;border-bottom:1px solid var(--line);font:700 9.5px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.facts b{display:block;font:400 21px Literata,Georgia,serif;letter-spacing:0;text-transform:none;color:var(--ink);margin-top:5px}
.alg{margin:14px 0 6px}
.alg h4{margin:0 0 12px;font:700 9.5px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.alg .row{display:flex;flex-wrap:wrap;gap:18px}
.alg figure{margin:0;text-align:center;font-size:11px;color:var(--mute)}
.alg figure .bd{--s:44px;display:grid;margin:0 auto 6px}
.ar{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;padding:16px 18px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#B8944F);color:#17110A;text-align:left;cursor:pointer;animation:pulse 2.6s infinite}
.ar::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:shine 3.4s infinite}
.ar .ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:rgba(20,14,6,.9);color:var(--gold2)}
.ar .tx b{display:block;font:700 17px/1.2 Manrope,sans-serif}
.ar .tx small{display:block;font:600 12px/1.3 Manrope,sans-serif;opacity:.75;margin-top:2px}
.ar .ic svg{animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,184,119,.45)}70%,100%{box-shadow:0 0 0 14px rgba(217,184,119,0)}}
@keyframes shine{0%,55%{left:-80px}100%{left:130%}}
.hint{margin:10px 2px 0;font-size:12.5px;color:var(--mute);line-height:1.4}
.note{font-size:13px;color:var(--gold2);margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}.eyebrow,.hc h1,.intro,.cue{opacity:1}.rule{width:140px}}
</style>
</head>

var io=null;
function reveal(){
  var items=document.querySelectorAll(".rv");
  if(!("IntersectionObserver" in window)){items.forEach(function(e){e.classList.add("in");});return;}
  if(io)io.disconnect();
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.12,rootMargin:"0px 0px -6% 0px"});
  items.forEach(function(e){io.observe(e);});
}

    '<div class="facts">'+facts.map(function(f){return '<div>'+f[0]+'<b>'+f[1]+'</b></div>';}).join("")+'</div>'+alg+
    '<button class="ar" id="arbtn"><span class="ic">'+VF+'</span><span class="tx"><b>'+t.ar+'</b><small>'+t.arsub+'</small></span></button>'+
    (s.glb?'<p class="hint">'+t.hint+'</p>':'')+'<p class="note" id="arnote" hidden>'+t.noar+'</p>';
  if(first){lockPage();$("sheet").classList.add("open");}
  $("panel").scrollTop=0;
  var mv=$("mv"),loaded=false;
  if(mv)mv.addEventListener("load",function(){loaded=true;mv.classList.add("ok");});
  $("cl").onclick=closeSheet;
  $("arbtn").onclick=function(){
    if(mv&&loaded){try{mv.activateAR();return;}catch(e){}}
    $("arnote").hidden=false;
  };
  document.querySelectorAll("#panel .pill").forEach(function(b){b.onclick=function(){openDish(i,+b.dataset.si);};});
}
function closeSheet(){
  if(!$("sheet").classList.contains("open"))return;
  $("sheet").classList.remove("open");unlockPage();
}

/* ---- events ---- */
$("lgbtn").addEventListener("click",function(e){e.stopPropagation();toggleLang();});
$("lgbox").addEventListener("click",function(e){var b=e.target.closest("button");if(b){lang=b.dataset.l;render();toggleLang(false);}});
document.addEventListener("click",function(e){if(!e.target.closest||!e.target.closest(".lg,.lgbox"))toggleLang(false);});
$("menu").addEventListener("click",function(e){var b=e.target.closest(".dish");if(b)openDish(+b.dataset.i);});
$("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")closeSheet();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeSheet();toggleLang(false);}});
document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest(".ar"))track("ar_click",{dish:currentDish});});
$("cue").addEventListener("click",function(){var m=$("menu");try{m.scrollIntoView({behavior:"smooth",block:"start"});}catch(e){m.scrollIntoView();}});
window.addEventListener("scroll",function(){
  var y=window.pageYOffset||0,h=window.innerHeight||700,p=Math.min(1,y/(h*.7));
  $("hc").style.opacity=String(1-p);$("hc").style.transform="translateY("+(-y*.25)+"px)";
},{passive:true});
render();
</script>
</body>
</html>
