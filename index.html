<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  color-scheme:dark;
  --bg:#0A0D11; --surface:#11161C; --ink:#EDEAE3; --mute:#85909A; --gold:#D9B877; --gold2:#F0D9A4; --line:#1D252D;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:44px 22px 72px}
header h1{font:400 46px/1 Literata,Georgia,serif;margin:0 0 16px;letter-spacing:-.02em;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 12px}
header h1 small{font:600 11px Manrope,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
header p{margin:0;color:var(--mute);font-size:15px;max-width:32ch}
.rule{height:1px;margin:28px 0 0;background:linear-gradient(90deg,var(--gold),transparent 70%)}
.langs{display:flex;gap:22px;margin:22px 0 4px}
.langs button{padding:6px 0;border:0;border-bottom:2px solid transparent;background:none;color:var(--mute);font:600 13px Manrope,sans-serif;letter-spacing:.06em;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
h2{font:600 11px Manrope,sans-serif;letter-spacing:.28em;text-transform:uppercase;margin:42px 0 4px;color:var(--gold)}
.dish{display:flex;width:100%;gap:16px;align-items:flex-start;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 0;margin:0;color:inherit;font:inherit;cursor:pointer;animation:rise .5s both}
.dish .t{flex:1;min-width:0}
.dish b{display:block;font:500 20px/1.25 Literata,Georgia,serif}
.dish small{display:block;color:var(--mute);font-size:14px;margin-top:3px}
.dish .tag{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:2px 9px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font:700 10px Manrope,sans-serif;letter-spacing:.14em}
.price{font:400 18px Literata,Georgia,serif;white-space:nowrap;color:var(--gold2);padding-top:2px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:26px 26px 0 0;padding:28px 22px calc(26px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.panel h3{font:400 32px/1.1 Literata,Georgia,serif;margin:0 0 8px}
.panel p{margin:0 0 6px;color:var(--mute)}
.bd{--s:34px;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border:1px solid var(--gold);border-radius:50%;background:var(--surface);color:var(--gold2);flex:none}
.bd svg{width:62%;height:62%;overflow:visible}
.tags{display:flex;flex-wrap:wrap;gap:12px 10px;margin:16px 0 2px}
.tags figure{margin:0;width:72px;text-align:center;font-size:10.5px;line-height:1.25;color:var(--mute)}
.tags figure .bd{display:grid;margin:0 auto 7px}
model-viewer{display:block;width:100%;height:2px;margin-top:0;opacity:0;background:transparent;--poster-color:transparent;transition:height .35s,opacity .35s,margin .35s}
model-viewer.ok{height:300px;margin-top:12px;opacity:1}
.pills{display:flex;gap:8px;margin:14px 0 4px}
.pill{flex:1;padding:10px 8px;border:1px solid var(--gold);border-radius:99px;background:none;color:var(--gold2);font:700 12.5px Manrope,sans-serif;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--gold);color:#17110A}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin:16px 0 6px}
.facts div{padding:12px 0;border-bottom:1px solid var(--line);font:700 9.5px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.facts b{display:block;font:400 21px Literata,Georgia,serif;letter-spacing:0;text-transform:none;color:var(--ink);margin-top:5px}
.alg{margin:14px 0 6px}
.alg h4{margin:0 0 12px;font:700 9.5px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.alg .row{display:flex;flex-wrap:wrap;gap:18px}
.alg figure{margin:0;text-align:center;font-size:11px;color:var(--mute)}
.alg figure .bd{--s:44px;display:grid;margin:0 auto 6px}
.ar{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;padding:16px 18px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#B8944F);color:#17110A;text-align:left;cursor:pointer;box-shadow:0 0 0 0 rgba(217,184,119,.5);animation:pulse 2.6s infinite}
.ar::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:shine 3.4s infinite}
.ar .ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:rgba(20,14,6,.9);color:var(--gold2)}
.ar .tx b{display:block;font:700 17px/1.2 Manrope,sans-serif}
.ar .tx small{display:block;font:600 12px/1.3 Manrope,sans-serif;opacity:.75;margin-top:2px}
@keyframes scan{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.ar .ic svg{animation:scan 2.2s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,184,119,.45)}70%,100%{box-shadow:0 0 0 14px rgba(217,184,119,0)}}
@keyframes shine{0%,55%{left:-80px}100%{left:130%}}
@media (prefers-reduced-motion:reduce){.ar,.ar::after,.ar .ic svg,.dish,.panel{animation:none}}
.close{width:100%;padding:14px;margin-top:6px;border:0;background:none;color:var(--mute);font:600 14px Manrope,sans-serif;cursor:pointer}
.note{font-size:13px;color:var(--mute);margin-top:10px}
</style>
</head>

};
var VF='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>';
var EYE='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
function nm(map,k){return map[k].split("|")[{el:0,en:1,de:2,it:3}[lang]];}
function badge(k,size,label){return '<span class="bd" style="--s:'+size+'px" role="img" title="'+label+'" aria-label="'+label+'"><svg viewBox="-8 -8 16 16" aria-hidden="true"><g transform="scale(1 -1)" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">'+ICONS[k]()+'</g></svg></span>';}

function fmt(n){return "€"+n.toFixed(2).replace(".",",");}
function sizesOf(d){return d.sizes||[{n:null,cm:d.cm,price:d.price,serves:d.serves,weight:d.weight,kcal:d.kcal,glb:d.glb,usdz:d.usdz}];}

function render(){
  var t=UI[lang];
  document.documentElement.lang=lang;
  document.getElementById("title").textContent=RESTAURANT;
  document.getElementById("eyebrow").textContent=t.eyebrow;
  document.getElementById("sub").textContent=t.sub;
  document.querySelectorAll("#langs button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===lang);});
  var html="",k=0;
  SECTIONS.forEach(function(sec){
    html+="<h2>"+sec.name[lang]+"</h2>";
    DISHES.forEach(function(d,i){
      if(d.s!==sec.id) return;
      var S=sizesOf(d),def=S[d.def||0],has=S.some(function(x){return x.glb;});
      html+='<button class="dish" style="animation-delay:'+(k++*45)+'ms" data-i="'+i+'"><span class="t"><b>'+d.n[lang]+'</b><small>'+d.d[lang]+'</small>'+(has?'<span class="tag">'+EYE+'3D</span>':'')+'</span><span class="price">'+fmt(def.price)+'</span></button>';
    });
  });
  document.getElementById("menu").innerHTML=html;
}

function openDish(i,si){
  var d=DISHES[i],t=UI[lang],S=sizesOf(d),first=(si==null);
  if(first) si=d.def||0;
  var s=S[si];
  currentDish=d.n.en+(S.length>1?" / "+s.n.en:"");
  if(first) track("dish_open",{dish:d.n.en});
  var model=s.glb?'<model-viewer id="mv" loading="eager" src="'+s.glb+'"'+(s.usdz?' ios-src="'+s.usdz+'"':'')+' ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" camera-controls shadow-intensity="1" alt="'+d.n[lang]+' · '+s.cm+' '+t.cm+'"><div slot="ar-button" style="display:none"></div></model-viewer>':'';
  var tags=(d.tags||[]).map(function(k){return '<figure>'+badge(k,36,nm(TAGS,k))+nm(TAGS,k)+'</figure>';}).join("");
  var pills=S.length>1?'<div class="pills">'+S.map(function(x,j){return '<button class="pill" data-si="'+j+'" aria-pressed="'+(j===si)+'">'+x.n[lang]+' · '+x.cm+' '+t.cm+'</button>';}).join("")+'</div>':'';
  var facts=[[t.size,s.cm+" "+t.cm],[t.serves,s.serves],[t.weight,s.weight+" "+t.g],[t.kcal,s.kcal+" kcal"],[t.time,d.time+" "+t.min],[t.price,fmt(s.price)]];
  var alg=(d.alg&&d.alg.length)?'<div class="alg"><h4>'+t.alg+'</h4><div class="row">'+d.alg.map(function(k){return '<figure>'+badge(k,44,nm(ALG,k))+nm(ALG,k)+'</figure>';}).join("")+'</div></div>':'';
  document.getElementById("panel").innerHTML=
    '<h3 id="sh-name">'+d.n[lang]+'</h3><p>'+d.d[lang]+'</p>'+
    (tags?'<div class="tags">'+tags+'</div>':'')+model+pills+
    '<div class="facts">'+facts.map(function(f){return '<div>'+f[0]+'<b>'+f[1]+'</b></div>';}).join("")+'</div>'+alg+
    '<button class="ar" id="arbtn"><span class="ic">'+VF+'</span><span class="tx"><b>'+t.ar+'</b><small>'+t.arsub+'</small></span></button><p class="note" id="arnote" hidden>'+t.noar+'</p>'+
    '<button class="close" id="cl">'+t.close+'</button>';
  document.getElementById("sheet").classList.add("open");
  var mv0=document.getElementById("mv");
  if(mv0)mv0.addEventListener("load",function(){mv0.classList.add("ok");});
  document.getElementById("cl").onclick=closeSheet;
  document.getElementById("arbtn").onclick=function(){
    var mv=document.getElementById("mv");
    if(mv&&s.glb){try{mv.activateAR();return;}catch(e){}}
    document.getElementById("arnote").hidden=false;
  };
  document.querySelectorAll("#panel .pill").forEach(function(b){b.onclick=function(){openDish(i,+b.dataset.si);};});
}
function closeSheet(){document.getElementById("sheet").classList.remove("open");}

document.getElementById("langs").addEventListener("click",function(e){var b=e.target.closest("button");if(b){lang=b.dataset.l;render();}});
document.getElementById("menu").addEventListener("click",function(e){var b=e.target.closest(".dish");if(b)openDish(+b.dataset.i);});
document.getElementById("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")closeSheet();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest(".ar"))track("ar_click",{dish:currentDish});});
render();
</script>
</body>
</html>
