<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0A0D11">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forno – Pizzeria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;500&family=Manrope:wght@400;600;700&display=swap&subset=greek" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0A0D11; --surface:#11161C; --ink:#EDEAE3; --mute:#85909A; --gold:#D9B877; --gold2:#F0D9A4; --line:#1D252D;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:44px 22px 72px}
.eyebrow{font:600 11px Manrope,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
header h1{font:400 46px/1 Literata,Georgia,serif;margin:0 0 16px;letter-spacing:-.02em;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 12px}
header h1 small{font:600 11px Manrope,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
header p{margin:0;color:var(--mute);font-size:15px;max-width:32ch}
.rule{height:1px;margin:28px 0 0;background:linear-gradient(90deg,var(--gold),transparent 70%)}
.langs{display:flex;gap:22px;margin:22px 0 4px}
.langs button{padding:6px 0;border:0;border-bottom:2px solid transparent;background:none;color:var(--mute);font:600 13px Manrope,sans-serif;letter-spacing:.06em;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
h2{font:600 11px Manrope,sans-serif;letter-spacing:.28em;text-transform:uppercase;margin:42px 0 4px;color:var(--gold)}
.dish{display:flex;width:100%;gap:16px;align-items:flex-start;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 0;margin:0;color:inherit;font:inherit;cursor:pointer;animation:rise .5s both}
.dish .t{flex:1;min-width:0}
.dish b{display:block;font:500 20px/1.25 Literata,Georgia,serif}
.dish small{display:block;color:var(--mute);font-size:14px;margin-top:3px}
.dish .tag{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:2px 9px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font:700 10px Manrope,sans-serif;letter-spacing:.14em}
.price{font:400 18px Literata,Georgia,serif;white-space:nowrap;color:var(--gold2);padding-top:2px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:26px 26px 0 0;padding:28px 22px calc(26px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.panel h3{font:400 32px/1.1 Literata,Georgia,serif;margin:0 0 8px}
.panel p{margin:0 0 16px;color:var(--mute)}
.scale{overflow-x:auto;background:var(--bg);border-radius:16px;padding:18px}
.facts{display:flex;margin:18px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{flex:1;padding:14px 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.facts div+div{padding-left:16px;border-left:1px solid var(--line)}
.facts b{display:block;font:400 22px Literata,Georgia,serif;letter-spacing:0;text-transform:none;color:var(--ink);margin-top:2px}
.ar{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:16px 18px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#B8944F);color:#17110A;text-align:left;cursor:pointer;box-shadow:0 0 0 0 rgba(217,184,119,.5);animation:pulse 2.6s infinite}
.ar::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:shine 3.4s infinite}
.ar .ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:rgba(20,14,6,.9);color:var(--gold2)}
.ar .tx b{display:block;font:700 17px/1.2 Manrope,sans-serif}
.ar .tx small{display:block;font:600 12px/1.3 Manrope,sans-serif;opacity:.75;margin-top:2px}
@keyframes scan{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.ar .ic svg{animation:scan 2.2s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,184,119,.45)}70%,100%{box-shadow:0 0 0 14px rgba(217,184,119,0)}}
@keyframes shine{0%,55%{left:-80px}100%{left:130%}}
@media (prefers-reduced-motion:reduce){.ar,.ar::after,.ar .ic svg,.dish,.panel{animation:none}}
.close{width:100%;padding:14px;margin-top:6px;border:0;background:none;color:var(--mute);font:600 14px Manrope,sans-serif;cursor:pointer}
.note{font-size:13px;color:var(--mute);margin-top:10px}
model-viewer{display:block;width:100%;height:300px;background:transparent;--poster-color:transparent}
.frame{position:relative;margin-top:16px;padding:10px}
.frame i{position:absolute;width:38px;height:38px;border:0 solid var(--gold);pointer-events:none;z-index:2}
.frame i:nth-child(1){top:0;left:0;border-width:3px 0 0 3px;border-top-left-radius:18px}
.frame i:nth-child(2){top:0;right:0;border-width:3px 3px 0 0;border-top-right-radius:18px}
.frame i:nth-child(3){bottom:0;right:0;border-width:0 3px 3px 0;border-bottom-right-radius:18px}
.frame i:nth-child(4){bottom:0;left:0;border-width:0 0 3px 3px;border-bottom-left-radius:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span id="title">Forno</span><small id="eyebrow">Pizzeria</small></h1>
    <p id="sub"></p>
    <div class="rule"></div>
  </header>
  <div class="langs" id="langs">
    <button data-l="el">EL</button>
    <button data-l="en">EN</button>
    <button data-l="de">DE</button>
  </div>
  <main id="menu"></main>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-name">
  <div class="panel" id="panel"></div>
</div>

<script>
/* ==== EDIT HERE: name, dishes, sizes. 3D: glb + usdz file names in the same folder ==== */
var RESTAURANT = "Forno";
var UI = {
  el:{eyebrow:"Πιτσαρία",sub:"Δες την πίτσα στο πραγματικό της μέγεθος, πάνω στο τραπέζι σου, πριν παραγγείλεις.",size:"Διάμετρος",serves:"Μερίδα",cm:"εκ.",ar:"Δες το στο τραπέζι σου",arsub:"Άνοιξε την κάμερα · πραγματικό μέγεθος",noar:"Το 3D μοντέλο θα προστεθεί σύντομα.",close:"Κλείσιμο",cup:"Φλιτζάνι καφέ",real:"Πραγματικό μέγεθος σε σύγκριση με φλιτζάνι καφέ."},
  en:{eyebrow:"Pizzeria",sub:"See your pizza at real size, on your own table, before you order.",size:"Diameter",serves:"Serves",cm:"cm",ar:"View on your table",arsub:"Open your camera · real size",noar:"The 3D model will be added soon.",close:"Close",cup:"Coffee cup",real:"Real size compared with a coffee cup."},
  de:{eyebrow:"Pizzeria",sub:"Sehen Sie Ihre Pizza in Originalgröße auf Ihrem Tisch, bevor Sie bestellen.",size:"Durchmesser",serves:"Portion",cm:"cm",ar:"Auf Ihrem Tisch ansehen",arsub:"Kamera öffnen · Originalgröße",noar:"Das 3D-Modell folgt in Kürze.",close:"Schließen",cup:"Kaffeetasse",real:"Originalgröße im Vergleich zu einer Kaffeetasse."}
};
var SECTIONS = [
 {id:"p",name:{el:"Πίτσες",en:"Pizzas",de:"Pizzen"}},
 {id:"s",name:{el:"Ορεκτικά",en:"Starters",de:"Vorspeisen"}},
 {id:"d",name:{el:"Γλυκά",en:"Desserts",de:"Desserts"}}
];
var DISHES = [
 {s:"p",price:9.5,cm:33,serves:"1-2",glb:"pizza-margherita.glb",usdz:"pizza-margherita.usdz",n:{el:"Μαργαρίτα",en:"Margherita",de:"Margherita"},d:{el:"Ντομάτα San Marzano, φιορ ντι λάτε, βασιλικός",en:"San Marzano tomato, fior di latte, basil",de:"San-Marzano-Tomate, Fior di Latte, Basilikum"}},
 {s:"p",price:11,cm:33,serves:"1-2",n:{el:"Πεπερόνι",en:"Pepperoni",de:"Peperoni"},d:{el:"Μοτσαρέλα, πικάντικο πεπερόνι",en:"Mozzarella, spicy pepperoni",de:"Mozzarella, scharfe Peperoni"}},
 {s:"p",price:12,cm:33,serves:"1-2",n:{el:"Κουάτρο Φορμάτζι",en:"Quattro Formaggi",de:"Quattro Formaggi"},d:{el:"Μοτσαρέλα, γκοργκονζόλα, παρμεζάνα, προβολόνε",en:"Mozzarella, gorgonzola, parmesan, provolone",de:"Mozzarella, Gorgonzola, Parmesan, Provolone"}},
 {s:"p",price:12.5,cm:33,serves:"1-2",n:{el:"Προσούτο & Μανιτάρια",en:"Prosciutto & Mushroom",de:"Prosciutto & Pilze"},d:{el:"Ζαμπόν, μανιτάρια, μοτσαρέλα",en:"Ham, mushrooms, mozzarella",de:"Schinken, Pilze, Mozzarella"}},
 {s:"s",price:5,cm:22,serves:"2",n:{el:"Σκορδόψωμο",en:"Garlic bread",de:"Knoblauchbrot"},d:{el:"Βούτυρο, σκόρδο, μαϊντανός",en:"Butter, garlic, parsley",de:"Butter, Knoblauch, Petersilie"}},
 {s:"s",price:6.5,cm:20,serves:"1-2",n:{el:"Μπρουσκέτα",en:"Bruschetta",de:"Bruschetta"},d:{el:"Ντομάτα, βασιλικός, ελαιόλαδο",en:"Tomato, basil, olive oil",de:"Tomate, Basilikum, Olivenöl"}},
 {s:"s",price:8,cm:22,serves:"1-2",n:{el:"Καπρέζε",en:"Caprese",de:"Caprese"},d:{el:"Μοτσαρέλα, ντομάτα, βασιλικός",en:"Mozzarella, tomato, basil",de:"Mozzarella, Tomate, Basilikum"}},
 {s:"d",price:6,cm:12,serves:"1",n:{el:"Τιραμισού",en:"Tiramisu",de:"Tiramisu"},d:{el:"Μασκαρπόνε, εσπρέσο, κακάο",en:"Mascarpone, espresso, cocoa",de:"Mascarpone, Espresso, Kakao"}},
 {s:"d",price:5.5,cm:10,serves:"1",n:{el:"Πάνα κότα",en:"Panna cotta",de:"Panna cotta"},d:{el:"Κρέμα βανίλιας, φρούτα του δάσους",en:"Vanilla cream, berries",de:"Vanillecreme, Beeren"}}
];
/* ==== end of editable part ==== */

var lang=(navigator.language||"en").slice(0,2); if(!UI[lang]) lang="en";
var CUP_CM=8;
var ICON='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>';
var EYE='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
var REAL={el:"Πραγματικό μέγεθος",en:"Real size",de:"Originalgröße"};
function iosSrc(d){
  var banner=new URL('banner.html?n='+encodeURIComponent(d.n[lang]),location.href).href;
  return d.usdz+'#custom='+encodeURIComponent(banner)+'&customHeight=small';
}
function fmt(n){return "€"+n.toFixed(2).replace(".",",");}

function render(){
  var t=UI[lang];
  document.documentElement.lang=lang;
  document.getElementById("title").textContent=RESTAURANT;
  document.getElementById("eyebrow").textContent=t.eyebrow;
  document.getElementById("sub").textContent=t.sub;
  document.querySelectorAll("#langs button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===lang);});
  var html="",k=0;
  SECTIONS.forEach(function(sec){
    html+="<h2>"+sec.name[lang]+"</h2>";
    DISHES.forEach(function(d,i){
      if(d.s!==sec.id) return;
      html+='<button class="dish" style="animation-delay:'+(k++*45)+'ms" data-i="'+i+'"><span class="t"><b>'+d.n[lang]+'</b><small>'+d.d[lang]+'</small>'+(d.glb?'<span class="tag">'+EYE+'3D</span>':'')+'</span><span class="price">'+fmt(d.price)+'</span></button>';
    });
  });
  document.getElementById("menu").innerHTML=html;
}

function scaleSvg(d){
  var t=UI[lang],W=300,maxCm=Math.max(d.cm,CUP_CM)+CUP_CM+6,k=W/maxCm;
  var rD=d.cm*k/2,rC=CUP_CM*k/2,H=Math.max(rD,rC)*2+30;
  var cx1=rD+2,cx2=2*rD+rC+14;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+t.real+'">'+
    '<circle cx="'+cx1+'" cy="'+(H-30)/2+'" r="'+rD+'" fill="rgba(217,184,119,.14)" stroke="var(--gold)" stroke-width="2.5"/>'+
    '<circle cx="'+cx2+'" cy="'+(H-30)/2+'" r="'+rC+'" fill="none" stroke="var(--mute)" stroke-width="2" stroke-dasharray="5 4"/>'+
    '<text x="'+cx1+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="var(--ink)" font-family="Manrope,sans-serif">'+d.cm+' '+t.cm+'</text>'+
    '<text x="'+cx2+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="var(--mute)" font-family="Manrope,sans-serif">'+t.cup+' '+CUP_CM+' '+t.cm+'</text></svg>';
}

function arBtn(slot){
  var t=UI[lang];
  return '<button '+(slot?'slot="ar-button" ':'id="arbtn" ')+'class="ar"><span class="ic">'+ICON+'</span><span class="tx"><b>'+t.ar+'</b><small>'+t.arsub+'</small></span></button>';
}

function openDish(i){
  var d=DISHES[i],t=UI[lang];
  var model=d.glb?'<model-viewer src="'+d.glb+'"'+(d.usdz?' ios-src="'+iosSrc(d).replace(/&/g,'&amp;')+'"':'')+' ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" camera-controls shadow-intensity="1" alt="'+d.n[lang]+' · '+d.cm+' '+t.cm+'">'+arBtn(true)+'</model-viewer>':'';
  var btn=d.glb?'':arBtn(false)+'<p class="note" id="arnote" hidden>'+t.noar+'</p>';
  document.getElementById("panel").innerHTML=
    '<h3 id="sh-name">'+d.n[lang]+'</h3><p>'+d.d[lang]+'</p>'+
        '<div class="facts"><div>'+t.size+'<b>'+d.cm+' '+t.cm+'</b></div><div>'+t.serves+'<b>'+d.serves+'</b></div><div>€<b>'+d.price.toFixed(2).replace(".",",")+'</b></div></div>'+
    (model?'<div class="frame"><i></i><i></i><i></i><i></i>'+model+'</div>':'')+btn+'<button class="close" id="cl">'+t.close+'</button>';
  document.getElementById("sheet").classList.add("open");
  document.getElementById("cl").onclick=closeSheet;
  var a=document.getElementById("arbtn");
  if(a) a.onclick=function(){document.getElementById("arnote").hidden=false;};
}
function closeSheet(){document.getElementById("sheet").classList.remove("open");}

document.getElementById("langs").addEventListener("click",function(e){var b=e.target.closest("button");if(b){lang=b.dataset.l;render();}});
document.getElementById("menu").addEventListener("click",function(e){var b=e.target.closest(".dish");if(b)openDish(+b.dataset.i);});
document.getElementById("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")closeSheet();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
render();
</script>
</body>
</html>
