<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taverna Demo – Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@500;700&family=Manrope:wght@400;600;700&display=swap&subset=greek" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root{
  --wall:#EEF1F2; --card:#FFFFFF; --ink:#14222E; --mute:#55646F; --door:#1F4E8C; --olive:#5B6B3A; --lemon:#E8C547; --line:#D5DCE0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wall:#0F1A23; --card:#172632; --ink:#EDF2F5; --mute:#9DB0BD; --door:#6FA3E8; --olive:#A3B86F; --line:#2A3C4A;}}
:root[data-theme="dark"]{--wall:#0F1A23; --card:#172632; --ink:#EDF2F5; --mute:#9DB0BD; --door:#6FA3E8; --olive:#A3B86F; --line:#2A3C4A;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--wall);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header h1{font:700 30px/1.15 Literata,Georgia,serif;margin:8px 0 2px}
header p{margin:0;color:var(--mute)}
.langs{display:flex;gap:8px;margin:16px 0 8px}
.langs button{flex:1;padding:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:600 15px Manrope,sans-serif;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--door);border-color:var(--door);color:#fff}
button:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
h2{font:700 20px Literata,Georgia,serif;margin:28px 0 10px;color:var(--olive)}
.dish{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer}
.dish .dot{flex:none;display:grid;place-items:center;width:56px;height:56px}
.dish .dot span{display:block;border-radius:50%;background:var(--lemon);border:3px solid var(--door)}
.dish .t{flex:1;min-width:0}
.dish b{display:block;font-weight:700}
.dish small{color:var(--mute)}
.price{font:700 16px Literata,Georgia,serif;white-space:nowrap}
.sheet{position:fixed;inset:0;background:rgba(10,20,28,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.panel h3{font:700 24px/1.2 Literata,Georgia,serif;margin:0 0 4px}
.panel p{margin:4px 0 12px;color:var(--mute)}
.scale{overflow-x:auto;background:var(--wall);border-radius:12px;padding:12px}
.facts{display:flex;gap:10px;margin:12px 0}
.facts div{flex:1;background:var(--wall);border-radius:10px;padding:10px;font-size:14px}
.facts b{display:block;font:700 18px Literata,Georgia,serif}
.cta{width:100%;padding:14px;border:0;border-radius:12px;background:var(--door);color:#fff;font:700 16px Manrope,sans-serif;cursor:pointer;margin-top:6px}
.close{width:100%;padding:12px;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:600 15px Manrope,sans-serif;cursor:pointer}
.note{font-size:14px;color:var(--mute);margin-top:8px}
model-viewer{width:100%;height:300px;background:var(--wall);border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Taverna Demo</h1>
    <p id="sub"></p>
  </header>
  <div class="langs" id="langs">
    <button data-l="el">Ελληνικά</button>
    <button data-l="en">English</button>
    <button data-l="de">Deutsch</button>
  </div>
  <main id="menu"></main>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-name">
  <div class="panel" id="panel"></div>
</div>

<script>
/* ==== EDIT HERE: restaurant name, dishes, sizes. Add a 3D model by setting glb:"https://.../dish.glb" ==== */
var RESTAURANT = "Taverna Demo";
var UI = {
  el:{sub:"Δείτε το πιάτο στο πραγματικό του μέγεθος πριν παραγγείλετε.",size:"Διάμετρος",serves:"Μερίδα",cm:"εκ.",ar:"Δες το στο τραπέζι σου",noar:"Το 3D μοντέλο θα προστεθεί σύντομα.",close:"Κλείσιμο",cup:"Φλιτζάνι καφέ",real:"Πραγματικό μέγεθος σε σύγκριση με φλιτζάνι καφέ."},
  en:{sub:"See your dish at real size before you order.",size:"Diameter",serves:"Serves",cm:"cm",ar:"View on your table",noar:"The 3D model will be added soon.",close:"Close",cup:"Coffee cup",real:"Real size compared with a coffee cup."},
  de:{sub:"Sehen Sie das Gericht in Originalgröße, bevor Sie bestellen.",size:"Durchmesser",serves:"Portion",cm:"cm",ar:"Auf Ihrem Tisch ansehen",noar:"Das 3D-Modell folgt in Kürze.",close:"Schließen",cup:"Kaffeetasse",real:"Originalgröße im Vergleich zu einer Kaffeetasse."}
};
var SECTIONS = [
 {id:"s",name:{el:"Ορεκτικά",en:"Starters",de:"Vorspeisen"}},
 {id:"m",name:{el:"Κυρίως",en:"Mains",de:"Hauptgerichte"}},
 {id:"d",name:{el:"Γλυκά",en:"Desserts",de:"Desserts"}}
];
var DISHES = [
 {s:"s",price:7.5,cm:22,serves:"1-2",n:{el:"Χωριάτικη σαλάτα",en:"Greek salad",de:"Griechischer Salat"},d:{el:"Ντομάτα, αγγούρι, φέτα, ελιές",en:"Tomato, cucumber, feta, olives",de:"Tomate, Gurke, Feta, Oliven"}},
 {s:"s",price:4.5,cm:14,serves:"2-3",n:{el:"Τζατζίκι",en:"Tzatziki",de:"Tzatziki"},d:{el:"Γιαούρτι, σκόρδο, αγγούρι",en:"Yogurt, garlic, cucumber",de:"Joghurt, Knoblauch, Gurke"}},
 {s:"m",price:12,cm:26,serves:"1",n:{el:"Σουβλάκι μερίδα",en:"Souvlaki plate",de:"Souvlaki-Teller"},d:{el:"2 καλαμάκια, πατάτες, πίτα",en:"2 skewers, fries, pita",de:"2 Spieße, Pommes, Pita"}},
 {s:"m",price:11,cm:24,serves:"1",n:{el:"Μουσακάς",en:"Moussaka",de:"Moussaka"},d:{el:"Μελιτζάνα, κιμάς, μπεσαμέλ",en:"Eggplant, minced meat, béchamel",de:"Aubergine, Hackfleisch, Béchamel"}},
 {s:"m",price:9.5,cm:33,serves:"2",glb:"pizza-margherita.glb",n:{el:"Πίτσα Μαργαρίτα",en:"Pizza Margherita",de:"Pizza Margherita"},d:{el:"Ντομάτα, μοτσαρέλα, βασιλικός",en:"Tomato, mozzarella, basil",de:"Tomate, Mozzarella, Basilikum"}},
 {s:"m",price:18,cm:32,serves:"2",n:{el:"Ψάρι στα κάρβουνα",en:"Grilled fish",de:"Gegrillter Fisch"},d:{el:"Ψάρι ημέρας με λαδολέμονο",en:"Catch of the day, lemon-oil",de:"Fang des Tages, Zitrone-Öl"}},
 {s:"d",price:6,cm:12,serves:"1",n:{el:"Μπακλαβάς",en:"Baklava",de:"Baklava"},d:{el:"Φύλλο, καρύδια, σιρόπι",en:"Phyllo, walnuts, syrup",de:"Filo, Walnüsse, Sirup"}},
 {s:"d",price:6.5,cm:16,serves:"2",n:{el:"Λουκουμάδες",en:"Loukoumades",de:"Loukoumades"},d:{el:"Με μέλι και κανέλα",en:"With honey and cinnamon",de:"Mit Honig und Zimt"}}
];
/* ==== end of editable part ==== */

var lang = (navigator.language||"en").slice(0,2);
if(!UI[lang]) lang="en";
var CUP_CM = 8;

function fmt(n){return "€"+n.toFixed(2).replace(".",",");}

function render(){
  var t = UI[lang];
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = RESTAURANT;
  document.getElementById("sub").textContent = t.sub;
  document.querySelectorAll("#langs button").forEach(function(b){b.setAttribute("aria-pressed", b.dataset.l===lang);});
  var html="";
  SECTIONS.forEach(function(sec){
    html += "<h2>"+sec.name[lang]+"</h2>";
    DISHES.forEach(function(d,i){
      if(d.s!==sec.id) return;
      var px = Math.round(12 + d.cm*1.5);
      html += '<button class="dish" data-i="'+i+'"><span class="dot"><span style="width:'+px+'px;height:'+px+'px"></span></span>'+
        '<span class="t"><b>'+d.n[lang]+'</b><small>'+d.d[lang]+' · '+d.cm+' '+t.cm+'</small></span>'+
        '<span class="price">'+fmt(d.price)+'</span></button>';
    });
  });
  document.getElementById("menu").innerHTML = html;
}

function scaleSvg(d){
  var t=UI[lang], W=300, maxCm=Math.max(d.cm,CUP_CM)+CUP_CM+6, k=W/maxCm;
  var rD=d.cm*k/2, rC=CUP_CM*k/2, H=Math.max(rD,rC)*2+30;
  var cx1=rD+2, cx2=2*rD+rC+14;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+t.real+'">'+
    '<circle cx="'+cx1+'" cy="'+(H-30)/2+'" r="'+rD+'" fill="var(--lemon)" stroke="var(--door)" stroke-width="3"/>'+
    '<circle cx="'+cx2+'" cy="'+(H-30)/2+'" r="'+rC+'" fill="none" stroke="var(--mute)" stroke-width="2.5" stroke-dasharray="5 4"/>'+
    '<text x="'+cx1+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="var(--ink)" font-family="Manrope,sans-serif">'+d.cm+' '+t.cm+'</text>'+
    '<text x="'+cx2+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="var(--mute)" font-family="Manrope,sans-serif">'+t.cup+' '+CUP_CM+' '+t.cm+'</text></svg>';
}

function openDish(i){
  var d=DISHES[i], t=UI[lang];
  var model = d.glb ? '<model-viewer src="'+d.glb+'" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" camera-controls alt="'+d.n[lang]+'"><button slot="ar-button" class="cta">'+t.ar+'</button></model-viewer>' : '';
  var btn = d.glb ? '' : '<button class="cta" id="arbtn">'+t.ar+'</button><p class="note" id="arnote" hidden>'+t.noar+'</p>';
  document.getElementById("panel").innerHTML =
    '<h3 id="sh-name">'+d.n[lang]+'</h3><p>'+d.d[lang]+'</p>'+
    '<div class="scale">'+scaleSvg(d)+'</div><p class="note">'+t.real+'</p>'+
    '<div class="facts"><div>'+t.size+'<b>'+d.cm+' '+t.cm+'</b></div><div>'+t.serves+'<b>'+d.serves+'</b></div><div>€<b>'+d.price.toFixed(2).replace(".",",")+'</b></div></div>'+
    model+btn+'<button class="close" id="cl">'+t.close+'</button>';
  document.getElementById("sheet").classList.add("open");
  document.getElementById("cl").onclick=closeSheet;
  var a=document.getElementById("arbtn");
  if(a) a.onclick=function(){document.getElementById("arnote").hidden=false;};
  document.getElementById("cl").focus();
}
function closeSheet(){document.getElementById("sheet").classList.remove("open");}

document.getElementById("langs").addEventListener("click",function(e){var b=e.target.closest("button");if(b){lang=b.dataset.l;render();}});
document.getElementById("menu").addEventListener("click",function(e){var b=e.target.closest(".dish");if(b)openDish(+b.dataset.i);});
document.getElementById("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")closeSheet();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
render();
</script>
</body>
</html>
