<style>
:root{color-scheme:dark;--bg:#0A0D11;--surface:#11161C;--ink:#EDEAE3;--mute:#85909A;--gold:#D9B877;--gold2:#F0D9A4;--gold3:#B8944F;--line:#1D252D;--grab:#2A343D;--on-accent:#17110A;--icon-bg:rgba(20,14,6,.9);--glass:rgba(10,13,17,.72);--glass2:rgba(10,13,17,.6);--surface0:rgba(17,22,28,0);--a15:rgba(217,184,119,.15);--a35:rgba(217,184,119,.35);--a45:rgba(217,184,119,.45);--a0:rgba(217,184,119,0)}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
/* language picker */
.lg{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:15;display:flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--line);border-radius:99px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);font:700 12px Manrope,sans-serif;letter-spacing:.1em;cursor:pointer}
.lg svg{width:15px;height:15px}
.lgbox{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));right:14px;z-index:16;width:min(300px,calc(100vw - 28px));display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 18px 50px rgba(0,0,0,.55);animation:pop .22s ease}
.lgbox[hidden]{display:none}
.lgbox button{padding:11px 12px;border:0;border-radius:11px;background:none;color:var(--ink);font:600 14px Manrope,sans-serif;text-align:left;cursor:pointer}
.lgbox button[aria-selected="true"]{background:var(--gold);color:var(--on-accent)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
/* hero */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 28px 110px;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(60% 42% at 50% 34%,var(--a15),transparent 70%);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.hc{position:relative;max-width:420px;will-change:transform,opacity}
.eyebrow{margin:0 0 16px;font:700 11px Manrope,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);opacity:0;animation:rise .9s .1s forwards}
.hc h1{margin:0;font:400 clamp(56px,17vw,84px)/1 Literata,Georgia,serif;letter-spacing:-.02em;opacity:0;animation:rise .9s .25s forwards}
.hc h1 img.logo{display:block;margin:0 auto;width:min(260px,64vw);height:auto;max-height:34vh;object-fit:contain}
.rule{height:1px;width:0;margin:26px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:grow 1.2s .6s forwards}
@keyframes grow{to{width:140px}}
.intro{margin:0;color:var(--mute);font-size:16px;line-height:1.6;opacity:0;animation:rise .9s .8s forwards}
.chip{display:inline-flex;align-items:center;gap:5px;margin:0 2px;padding:1px 9px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font:700 10.5px Manrope,sans-serif;letter-spacing:.12em;vertical-align:1px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cue{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:0;right:0;margin:0 auto;width:max-content;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--gold2);font:700 14px Manrope,sans-serif;letter-spacing:.28em;text-transform:uppercase;cursor:pointer;opacity:0;animation:rise .9s 1.3s forwards}
#cuetxt{padding-left:.28em}
.arrows{display:flex;flex-direction:column;align-items:center;gap:0}
.arrows svg{width:30px;height:17px;margin-top:-5px;opacity:0;animation:wave 1.7s ease-in-out infinite}
.arrows svg:nth-child(2){animation-delay:.22s}.arrows svg:nth-child(3){animation-delay:.44s}
@keyframes wave{0%{opacity:0;transform:translateY(-6px)}45%{opacity:1}100%{opacity:0;transform:translateY(8px)}}
/* menu */
.wrap{max-width:580px;margin:0 auto;padding:36px 22px 80px}
h2{font:600 13px Manrope,sans-serif;letter-spacing:.28em;text-transform:uppercase;margin:52px 0 6px;color:var(--gold)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.dish{display:flex;width:100%;gap:16px;align-items:flex-start;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:24px 0;margin:0;color:inherit;font:inherit;cursor:pointer}
.dish .t{flex:1;min-width:0}
.dish b{display:block;font:500 24px/1.25 Literata,Georgia,serif}
.dish small{display:block;color:var(--mute);font-size:15.5px;line-height:1.45;margin-top:4px}
.dish .tag{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:2px 9px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font:700 11px Manrope,sans-serif;letter-spacing:.14em}
.price{font:400 21px Literata,Georgia,serif;white-space:nowrap;color:var(--gold2);padding-top:3px}
/* sheet */
body.lock{position:fixed;width:100%;overflow:hidden}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{position:relative;background:var(--surface);width:100%;max-width:520px;max-height:93%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:28px 28px 0 0;border-top:1px solid var(--a35);padding:0 22px calc(28px + env(safe-area-inset-bottom,0px));animation:up .38s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
.bar{position:sticky;top:0;z-index:3;display:flex;justify-content:center;padding:12px 0 14px;margin:0 -22px;background:linear-gradient(var(--surface) 65%,var(--surface0))}
.grab{width:44px;height:4px;border-radius:4px;background:var(--grab)}
.x{position:absolute;right:16px;top:8px;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--ink);cursor:pointer}
.x svg{width:16px;height:16px}
.panel h3{font:400 34px/1.1 Literata,Georgia,serif;margin:6px 0 8px}
.panel p{margin:0 0 6px;color:var(--mute)}
.bd{--s:34px;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border:1px solid var(--gold);border-radius:50%;background:var(--surface);color:var(--gold2);flex:none}
.bd svg{width:62%;height:62%;overflow:visible}
.tags{display:flex;flex-wrap:wrap;gap:12px 10px;margin:16px 0 2px}
.tags figure{margin:0;width:72px;text-align:center;font-size:10.5px;line-height:1.25;color:var(--mute)}
.tags figure .bd{display:grid;margin:0 auto 7px}
model-viewer{display:block;width:100%;height:2px;margin-top:0;opacity:0;background:transparent;--poster-color:transparent;transition:height .35s,opacity .35s,margin .35s}
model-viewer.ok{height:300px;margin-top:12px;opacity:1}
/* camera view for phones without Google AR (ARCore): live camera with the dish drawn over it */
.cam{position:fixed;inset:0;z-index:50;background:#000}
.cam[hidden]{display:none}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam model-viewer{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:1;background:transparent}
.cam .x{top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:2;background:rgba(10,13,17,.7);color:#EDEAE3}
.cam canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none}
.cam canvas.on{pointer-events:auto}
.camhint{position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:0;padding:12px 14px;border-radius:14px;background:rgba(10,13,17,.72);color:var(--ink);font:600 13.5px/1.45 Manrope,sans-serif;text-align:center}
.pills{display:flex;gap:8px;margin:14px 0 4px}
.pill{flex:1;min-width:0;padding:8px 6px;border:1px solid var(--gold);border-radius:16px;background:none;color:var(--gold2);font:700 12.5px/1.25 Manrope,sans-serif;cursor:pointer}
.pill b{display:block;font-weight:700}
.pill small{display:block;font-weight:600;font-size:11px;opacity:.75}
.pill[aria-pressed="true"]{background:var(--gold);color:var(--on-accent)}
.ext{margin:14px 0 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ext summary{display:flex;align-items:center;justify-content:space-between;padding:13px 0;list-style:none;cursor:pointer;font:700 9.5px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ext summary::-webkit-details-marker{display:none}
.ext summary::after{content:"";width:7px;height:7px;margin-right:4px;border-right:1.6px solid var(--gold);border-bottom:1.6px solid var(--gold);transform:rotate(45deg);transition:transform .2s}
.ext[open] summary::after{transform:rotate(-135deg)}
.ext ul{margin:0;padding:0 0 12px;list-style:none}
.ext li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14.5px;color:var(--ink)}
.ext li span{color:var(--gold2);white-space:nowrap}
.demo{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:14px;right:90px;z-index:2;margin:0;text-align:left;font:600 11.5px/1.35 Manrope,sans-serif;color:var(--gold2);opacity:0;animation:rise .9s .1s forwards}
.demo span{display:inline-block;padding:5px 10px;border:1px dashed var(--gold);border-radius:10px;background:var(--glass2)}
.hc h1.long{font-size:clamp(38px,11.5vw,64px);overflow-wrap:anywhere}
.smp{margin:48px 0 0;text-align:center;font-size:12px;line-height:1.5;color:var(--mute)}
.cta{margin:56px 0 0;padding:26px 22px;border:1px solid var(--a35);border-radius:22px;background:var(--surface);text-align:center}

.cta a svg{width:20px;height:20px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin:16px 0 6px}
.facts div{padding:12px 0;border-bottom:1px solid var(--line);font:700 9.5px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.facts b{display:block;font:400 21px Literata,Georgia,serif;letter-spacing:0;text-transform:none;color:var(--ink);margin-top:5px}
.alg{margin:14px 0 6px}
.alg h4{margin:0 0 12px;font:700 9.5px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.alg .row{display:flex;flex-wrap:wrap;gap:18px}
.alg figure{margin:0;text-align:center;font-size:11px;color:var(--mute)}
.alg figure .bd{--s:44px;display:grid;margin:0 auto 6px}
.ar{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;padding:16px 18px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--gold3));color:var(--on-accent);text-align:left;cursor:pointer;animation:pulse 2.6s infinite}
.ar::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:shine 3.4s infinite}
.ar .ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--icon-bg);color:var(--icon-ink,var(--gold2))}
.ar .tx b{display:block;font:700 17px/1.2 Manrope,sans-serif}
.ar .tx small{display:block;font:600 12px/1.3 Manrope,sans-serif;opacity:.75;margin-top:2px}
.ar .ic svg{animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--a45)}70%,100%{box-shadow:0 0 0 14px var(--a0)}}
@keyframes shine{0%,55%{left:-80px}100%{left:130%}}
.hint{margin:10px 2px 0;font-size:12.5px;color:var(--mute);line-height:1.4}
.note{font-size:13px;color:var(--gold2);margin-top:10px}

<script type="module">
/* ---- AR with the table QR, for phones without Google AR ----
   A QR sticker of known size (QR_SIZE) lies flat on the table. In every camera frame we find its 4 corners;
   from how big and how skewed they look we compute where the table is (a "pose": rotation + position),
   and draw the dish with three.js on that table, at real size, next to the QR. The pose comes from the camera
   image itself, so the dish stays put while the phone moves, as long as the QR stays in view.
   Exposed to the page as window.markerAR = {start, stop}. three.js and the QR reader load only when used. */
const QR_SIZE = 0.065;     // printed QR symbol side in metres: must match QR_MM in tools/qr.py
const LONG_FOV = 65;       // assumed camera field of view along the long side of the video (errors largely
                           // cancel: the dish is drawn with the same camera that measured the QR)
const FIND_LIMIT = 8000;   // ms without any QR before the page falls back to the simple camera view
let S = null;              // the running session

const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
      dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], scl=(a,k)=>[a[0]*k,a[1]*k,a[2]*k],
      cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
      len=a=>Math.hypot(a[0],a[1],a[2]), unit=a=>scl(a,1/len(a));

function solve(A, b) {               // small linear system, Gauss-Jordan with partial pivoting
  const n = b.length, M = A.map((r, i) => r.concat([b[i]]));
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    if (Math.abs(M[p][c]) < 1e-12) return null;
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < n; r++) if (r !== c) {
      const k = M[r][c] / M[c][c];
      for (let j = c; j <= n; j++) M[r][j] -= k * M[c][j];
    }
  }
  return M.map((r, i) => r[n] / r[i]);
}

/* Pose of the QR in camera axes (x right, y down, z forward). corners: TL, TR, BR, BL in video pixels.
   Marker axes: x along the QR's top edge, y down its left edge, z into the table. */
/* Camera focal length (pixels) seen from one view of the QR. Every phone's camera is different and a wrong
   focal skews size and tilt. The QR is a square, so in the true focal its two edges come out perpendicular and
   equally long; with the homography H (QR plane -> centred pixels) that gives two equations for f². They are
   only informative when the QR is seen at a slant, so flat-on views give nothing. Returns [f, ...] or []. */
function focalFrom(corners, vw, vh) {
  const obj = [[-1, -1], [1, -1], [1, 1], [-1, 1]], A = [], b = [];
  corners.forEach((p, i) => {
    const [X, Y] = obj[i], x = p.x - vw / 2, y = p.y - vh / 2;
    A.push([X, Y, 1, 0, 0, 0, -x * X, -x * Y]); b.push(x);
    A.push([0, 0, 0, X, Y, 1, -y * X, -y * Y]); b.push(y);
  });
  const g = solve(A, b);
  if (!g) return [];
  const [h11, h12, , h21, h22, , h31, h32] = g, out = [];
  const scale = Math.max(Math.abs(h11), Math.abs(h12), Math.abs(h21), Math.abs(h22));
  const tryF = (num, den) => {               // f² = -num/den, only when the slant term is clearly non-zero
    if (Math.abs(den) * vw * vw < 0.02 * scale * scale) return;
    const f2 = -num / den;
    if (f2 > 0) out.push(Math.sqrt(f2));
  };
  tryF(h11 * h12 + h21 * h22, h31 * h32);
  tryF(h11 * h11 + h21 * h21 - h12 * h12 - h22 * h22, h31 * h31 - h32 * h32);
  return out;
}

function poseFrom(corners, vw, vh, f) {
  const h = QR_SIZE / 2, obj = [[-h, -h], [h, -h], [h, h], [-h, h]];
  const img = corners.map(p => [(p.x - vw / 2) / f, (p.y - vh / 2) / f]);
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [X, Y] = obj[i], [x, y] = img[i];
    A.push([X, Y, 1, 0, 0, 0, -x * X, -x * Y]); b.push(x);
    A.push([0, 0, 0, X, Y, 1, -y * X, -y * Y]); b.push(y);
  }
  const g = solve(A, b);
  if (!g) return null;
  const b1 = [g[0], g[3], g[6]], b2 = [g[1], g[4], g[7]], b3 = [g[2], g[5], 1];
  let lam = 2 / (len(b1) + len(b2));
  if (b3[2] * lam < 0) lam = -lam;                         // the QR is in front of the camera
  const x0 = unit(b1), y0 = unit(b2), u = unit(add(x0, y0)), v = unit(sub(x0, y0));
  const rx = scl(add(u, v), Math.SQRT1_2), ry = scl(sub(u, v), Math.SQRT1_2);   // nearest true rotation
  const rz = cross(rx, ry), t = scl(b3, lam);
  // reject bad reads: the 4 corners must reproject close to where they were seen
  let err = 0;
  obj.forEach(([X, Y], i) => {
    const p = add(add(scl(rx, X), scl(ry, Y)), t);
    err = Math.max(err, Math.hypot(p[0] / p[2] - img[i][0], p[1] / p[2] - img[i][1]));
  });
  const size = Math.hypot(img[1][0] - img[0][0], img[1][1] - img[0][1]);
  if (!(t[2] > 0.05 && err < 0.08 * size)) return null;
  return { rx, ry, rz, t, obj, img };
}

/* The weak part of a pose from a small square is its tilt, and a tilt error shows up as a size error.
   The table is level, so its tilt is known from the phone's gravity sensor (which, unlike the gyroscope, does
   not drift). down: unit "into the table" direction in camera axes. We blend it into the QR's normal, keep the
   QR's own turn, then re-solve the distance with that rotation fixed (linear least squares on the corners). */
function levelPose(P, down) {
  if (dot(down, P.rz) < 0.8) return P;            // they disagree a lot (table not level?): keep the QR's own
  const rz = unit(add(scl(down, 0.8), scl(P.rz, 0.2)));

  const M = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], r = [0, 0, 0];
  P.obj.forEach(([X, Y], i) => {
    const q = add(scl(rx, X), scl(ry, Y)), [u, v] = P.img[i];
    // (q + t) projected = (u, v):  t.x - u t.z = u q.z - q.x ;  t.y - v t.z = v q.z - q.y
    [[[1, 0, -u], u * q[2] - q[0]], [[0, 1, -v], v * q[2] - q[1]]].forEach(([a, bb]) => {
      for (let j = 0; j < 3; j++) { r[j] += a[j] * bb; for (let k = 0; k < 3; k++) M[j][k] += a[j] * a[k]; }
    });
  });
  const t = solve(M, r);
  return t && t[2] > 0.05 ? { rx, ry, rz, t, obj: P.obj, img: P.img, level: true } : P;
}

async function loadLibs() {
  const [THREE, { GLTFLoader }, { DRACOLoader }] = await Promise.all([
    // esm.sh: full URLs (no import map, which older Chrome lacks); it serves code the visiting browser understands,
    // and the loaders get the same three.js instance
    import("https://esm.sh/three@0.160.0"), import("https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"),
    import("https://esm.sh/three@0.160.0/examples/jsm/loaders/DRACOLoader.js")]);
  return { THREE, GLTFLoader, DRACOLoader };
}
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  return new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; s.onload = ok; s.onerror = no;
    document.head.appendChild(s);
  });
}

/* QR corners in the current video frame, in the QR's own order (TL, TR, BR, BL of the QR, whichever way the
   phone is turned), or null. The order matters: it decides which side of the QR the dish is on.
   jsQR finds the 3 big finder squares, so its corners are always in the QR's order; it is the authority.
   The phone's built-in reader (when present) is better at finding a small or slanted QR, but may list the
   corners from the screen's top-left, so it is only used to tell jsQR where to look, or, for a moment when
   jsQR misses, matched to the last known corners by position. */
function bbox(c) {
  const xs = c.map(p => p.x), ys = c.map(p => p.y);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}
function matchOrder(c, prev) {           // cyclic order of c closest to prev (both in image pixels)
  let best = null, bd = Infinity;
  for (let k = 0; k < 4; k++) {
    const r = c.slice(k).concat(c.slice(0, k));
    const d = r.reduce((a, p, i) => a + Math.hypot(p.x - prev[i].x, p.y - prev[i].y), 0);
    if (d < bd) { bd = d; best = r; }

}
async function findCorners(s) {
  const v = s.video;
  if (!window.jsQR) return null;
  const VW = v.videoWidth, VH = v.videoHeight;
  if (!VW || !VH) return null;
  // jsQR on a region of the frame (sharper and faster), or on the whole frame
  const read = (x0, y0, cw, ch, maxSide) => {
    const k = Math.min(1, maxSide / Math.max(cw, ch)), w = Math.round(cw * k), h = Math.round(ch * k);
    if (w < 40 || h < 40) return null;
    s.cv.width = w; s.cv.height = h;
    s.cx.drawImage(v, x0, y0, cw, ch, 0, 0, w, h);
    const q = window.jsQR(s.cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
    if (!q) return null;
    s.dbg.jsqr = (s.dbg.jsqr || 0) + 1;
    const L = q.location;
    return [L.topLeftCorner, L.topRightCorner, L.bottomRightCorner, L.bottomLeftCorner].map(p => ({ x: x0 + p.x / k, y: y0 + p.y / k }));
  };
  const around = (q, grow) => {          // jsQR on the area around corners q
    const [minX, minY, maxX, maxY] = bbox(q), m = Math.max(maxX - minX, maxY - minY) * grow;
    const x0 = Math.max(0, minX - m), y0 = Math.max(0, minY - m), x1 = Math.min(VW, maxX + m), y1 = Math.min(VH, maxY + m);
    return read(x0, y0, x1 - x0, y1 - y0, 1000);   // around the QR: (almost) full resolution, small QRs need it
  };
  const now = performance.now(), recent = s.last && now - s.lastAt < 1500;
  let c = null;
  if (s.detector) {
    // fast path: the phone's own reader (native, quick) every frame. Its corners are put in the order of the last
    // known corners; jsQR (slower) is only run to set the order at the start, and every 10th frame to re-check it.
    let d = null;
    try { const r = await s.detector.detect(v); d = r && r[0] && r[0].cornerPoints; }
    catch (e) { s.detector = null; }     // the built-in reader failed: jsQR only from now on
    if (d && d.length === 4) {
      d = d.map(p => ({ x: p.x, y: p.y }));
      s.dbg.builtin = (s.dbg.builtin || 0) + 1;
      s.n = (s.n || 0) + 1;
      if (!recent || s.n % 10 === 0) c = around(d, 0.25);
      if (!c) c = recent ? matchOrder(d, s.last) : d;
    }
  } else if (s.last) c = around(s.last, 0.9);
  if (!c && (!s.detector || (s.miss = (s.miss || 0) + 1) % 3 === 0)) c = read(0, 0, VW, VH, 960) || read(0, 0, VW, VH, 1280);   // whole frame (every 3rd miss when the built-in reader is searching too)
  if (c) { s.last = c; s.lastAt = now; }
  else if (now - (s.lastAt || 0) > 400) s.last = null;
  return c;
}

async function start(opt) {
  stop();
  const s = S = { video: opt.video, canvas: opt.canvas, alive: true, dbg: { libs: "loading" },
                  pose: null, seen: 0, place: null, everFound: false, t0: performance.now() };
  // state changes go to the page, to the stats (once per state per session) and to the ?debug=1 panel
  const told = {};
  s.onState = (state, err) => {
    s.dbg.state = state; if (err) s.dbg.err = String(err).slice(0, 160);
    (opt.onState || (() => {}))(state);
    if (!told[state] && window.track) { told[state] = 1; window.track("ar_marker", { state, err: s.dbg.err || "", reader: s.detector ? "builtin" : "jsqr" }); }
  };
  if (/[?&]debug/.test(location.search)) {
    s.dbgEl = document.createElement("pre");
    s.dbgEl.style.cssText = "position:absolute;left:8px;top:64px;z-index:3;margin:0;padding:6px 8px;max-width:70%;white-space:pre-wrap;font:11px/1.35 monospace;color:#0f0;background:rgba(0,0,0,.6);border-radius:6px";
    s.canvas.parentNode.appendChild(s.dbgEl);
  }
  s.onState("searching");
  let L;
  try {
    if ("BarcodeDetector" in window) {
      const f = await BarcodeDetector.getSupportedFormats();
      if (f.includes("qr_code")) s.detector = new BarcodeDetector({ formats: ["qr_code"] });
    }
    [L] = await Promise.all([loadLibs(), loadJsQR()]);
    s.dbg.libs = "ok";
  } catch (e) { s.dbg.libs = "FAILED"; if (s.alive) { s.onState("error", e && (e.message || e)); showDbg(s); } return; }
  if (!s.alive) return;
  const { THREE, GLTFLoader, DRACOLoader } = L;
  s.cv = document.createElement("canvas"); s.cx = s.cv.getContext("2d", { willReadFrequently: true });

  const renderer = s.renderer = new THREE.WebGLRenderer({ canvas: s.canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  const scene = new THREE.Scene(), camera = s.camera = new THREE.PerspectiveCamera(50, 1, 0.01, 30);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6b5a48, 2.2));
  const table = s.table = new THREE.Group(); table.matrixAutoUpdate = false; table.visible = false; scene.add(table);
  const spot = new THREE.Group(); table.add(spot);                 // where the dish sits, in table axes
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(0.15, -0.1, -0.8); sun.castShadow = true;       // above the table (table z points down into it)
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -0.4, right: 0.4, top: 0.4, bottom: -0.4, near: 0.1, far: 2 });
  spot.add(sun); spot.add(sun.target);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ opacity: 0.35, side: THREE.DoubleSide }));
  ground.receiveShadow = true; spot.add(ground);

  const loader = new GLTFLoader(), draco = new DRACOLoader();
  draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
  loader.setDRACOLoader(draco);
  let radius = 0.17;
  loader.load(opt.src, gltf => {
    if (!s.alive) return;
    const dish = gltf.scene, box = new THREE.Box3().setFromObject(dish), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
    dish.position.set(-c.x, -box.min.y, -c.z);                     // centred, resting on the table
    dish.traverse(o => { if (o.isMesh) o.castShadow = true; });
    const holder = new THREE.Group(); holder.rotation.x = -Math.PI / 2;   // glTF "up" -> out of the table
    holder.add(dish); spot.add(holder);
    radius = Math.max(sz.x, sz.z) / 2;
    ground.scale.set(radius * 3, radius * 3, 1);
  }, undefined, e => { if (s.alive) s.onState("error", "3D model: " + (e && (e.message || e))); });

  const focal0 = () => Math.max(s.video.videoWidth, s.video.videoHeight) / 2 / Math.tan(LONG_FOV * Math.PI / 360);
  /* Focal length: with the tilt taken from gravity a wrong focal no longer cancels out (it shows as a size error),
     so each phone's focal is measured: the focal at which the QR's own tilt agrees with gravity. Per view we
     scan focals, keep the best when the view is slanted enough to tell, and use the median of many views. */
  s.fg = [];
  const focal = () => s.fGrav || focal0();
  function learnFocalFromGravity(c) {
    if (!s.down || performance.now() - s.downAt > 500) return;
    const f0 = focal0(), vw = s.video.videoWidth, vh = s.video.videoHeight;
    let best = null, bestA = 9, worstA = 0;
    for (let m = 0.6; m <= 1.61; m += 0.025) {
      const P = poseFrom(c, vw, vh, f0 * m);
      if (!P) continue;
      const a = Math.acos(Math.min(1, dot(P.rz, s.down)));
      if (a < bestA) { bestA = a; best = f0 * m; }
      if (a > worstA) worstA = a;
    }
    if (best && worstA - bestA > 0.05 && bestA < 0.06) {     // informative view (>3° spread) and a good fit (<3.5°)
      s.fg.push(best); if (s.fg.length > 60) s.fg.shift();
      if (s.fg.length >= 8) {
        const srt = s.fg.slice().sort((a, b) => a - b); s.fGrav = srt[srt.length >> 1];
        s.dbg.fov = (2 * Math.atan(Math.max(vw, vh) / 2 / s.fGrav) * 180 / Math.PI).toFixed(1) + "° (" + s.fg.length + " views, gravity)";
      }
    }
  }
  // gravity from the phone's tilt sensors -> "into the table" direction in camera axes (see levelPose)
  const onGrav = e => {
    if (e.beta == null || e.gamma == null) return;
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    s.down = [Math.cos(b) * Math.sin(g), Math.sin(b), Math.cos(b) * Math.cos(g)]; s.downAt = performance.now();
  };
  window.addEventListener("deviceorientation", onGrav);
  s.offGrav = () => window.removeEventListener("deviceorientation", onGrav);
  s.fs = [];
  function learnFocal(c) {
    const f0 = focal0();
    focalFrom(c, s.video.videoWidth, s.video.videoHeight).forEach(f => {
      if (f > 0.55 * f0 && f < 1.8 * f0) s.fs.push(f);
    });
    if (s.fs.length > 80) s.fs.splice(0, s.fs.length - 80);
    if (s.fs.length >= 12) {
      const sorted = s.fs.slice().sort((a, b) => a - b);
      s.fEst = sorted[sorted.length >> 1];
      s.dbg.fov = (2 * Math.atan(Math.max(s.video.videoWidth, s.video.videoHeight) / 2 / s.fEst) * 180 / Math.PI).toFixed(1) + "° (" + s.fs.length + " views)";
    }
  }
  const coverScale = () => Math.max(innerWidth / s.video.videoWidth, innerHeight / s.video.videoHeight);

  // a screen point -> point on the table (table axes), using the current pose; null if it misses the table
  function onTable(sx, sy) {
    if (!s.pose) return null;
    const F = focal() * coverScale(), d = [(sx - innerWidth / 2) / F, (sy - innerHeight / 2) / F, 1];
    const { rx, ry, rz, t } = s.pose;
    const o = [-dot(rx, t), -dot(ry, t), -dot(rz, t)], dm = [dot(rx, d), dot(ry, d), dot(rz, d)];   // camera & ray in table axes
    if (Math.abs(dm[2]) < 1e-6) return null;
    const k = -o[2] / dm[2];
    return k > 0 ? [o[0] + k * dm[0], o[1] + k * dm[1]] : null;
  }
  function keepClear(p) {           // the dish must not cover the QR, or the camera loses it
    const need = QR_SIZE * 0.75 + radius + 0.01, n = Math.hypot(p[0], p[1]);
    if (n >= need) return p;
    let dir = n > 1e-3 ? [p[0] / n, p[1] / n] : null;
    if (!dir) { const { rx, ry, t } = s.pose, o = [-dot(rx, t), -dot(ry, t)], m = Math.hypot(o[0], o[1]) || 1; dir = [o[0] / m, o[1] / m]; }
    return [dir[0] * need, dir[1] * need];
  }
  function setPlace(p) { s.place = keepClear(p); spot.position.set(s.place[0], s.place[1], 0); }

  // drag the dish along the table
  let drag = false;
  s.canvas.onpointerdown = e => { drag = true; s.canvas.setPointerCapture(e.pointerId); };
  s.canvas.onpointermove = e => { if (!drag) return; const p = onTable(e.clientX, e.clientY); if (p) setPlace(p); };
  s.canvas.onpointerup = s.canvas.onpointercancel = () => { drag = false; };

  const smooth = { p: new THREE.Vector3(), q: new THREE.Quaternion(), ok: false }, m4 = new THREE.Matrix4();
  function usePose(P) {
    s.pose = P;
    // camera axes (x right, y down, z forward) -> three.js (x right, y up, z back)
    const X = [P.rx[0], -P.rx[1], -P.rx[2]], Y = [P.ry[0], -P.ry[1], -P.ry[2]], Z = [P.rz[0], -P.rz[1], -P.rz[2]];
    m4.set(X[0], Y[0], Z[0], P.t[0], X[1], Y[1], Z[1], -P.t[1], X[2], Y[2], Z[2], -P.t[2], 0, 0, 0, 1);
    const p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
    m4.decompose(p, q, sc);
    if (!smooth.ok || p.distanceTo(smooth.p) > 0.25) { smooth.p.copy(p); smooth.q.copy(q); smooth.ok = true; }
    else {
      // adaptive smoothing: follow quickly when the phone moves (big change), smooth hard when it is still
      // (small change = mostly noise of the corner detection)
      const move = p.distanceTo(smooth.p) / 0.015 + smooth.q.angleTo(q) / 0.05;   // 1.5 cm or 3 deg ≈ 1
      const k = Math.min(0.95, 0.25 + 0.3 * move);
      smooth.p.lerp(p, k); smooth.q.slerp(q, k);
    }
    table.matrix.compose(smooth.p, smooth.q, new THREE.Vector3(1, 1, 1));
    table.matrixWorldNeedsUpdate = true;
    if (!s.place) setPlace(onTable(innerWidth / 2, innerHeight * 0.55) || [0, 0]);
    table.visible = true;
  }

  function bestPose(c) {          // corners already in the QR's own order (see findCorners)
    if (!s.fGrav) learnFocal(c);
    learnFocalFromGravity(c);
    const P = poseFrom(c, s.video.videoWidth, s.video.videoHeight, focal());
    // gravity only once this phone's focal is known (with a wrong focal, forcing the tilt makes size worse)
    const level = P && s.fGrav && s.down && performance.now() - s.downAt < 500;
    s.dbg.level = level ? "gravity" : "QR only";
    return level ? levelPose(P, s.down) : P;
  }

  async function seek() {
    if (!s.alive) return;
    if (s.video.readyState >= 2) {
      const c = await findCorners(s);
      const P = c && bestPose(c);
      if (!s.alive) return;
      s.dbg.tries = (s.dbg.tries || 0) + 1;
      if (c && !P) s.dbg.rejected = (s.dbg.rejected || 0) + 1;
      if (P) {
        s.dbg.poses = (s.dbg.poses || 0) + 1; s.dbg.dist = Math.round(len(P.t) * 100) + " cm";
        usePose(P); s.seen = performance.now();
        if (!s.everFound) { s.everFound = true; s.canvas.classList.add("on"); }
        s.onState("found");
      } else if (s.everFound && performance.now() - s.seen > 1200) s.onState("lost");
      else if (!s.everFound && performance.now() - s.t0 > FIND_LIMIT) s.onState("nomarker");
    }
    showDbg(s);
    s.timer = setTimeout(seek, 50);
  }
  seek();

  (function frame() {
    if (!s.alive) return;
    if (s.video.videoWidth) {
      const W = innerWidth, H = innerHeight, F = focal() * coverScale();
      renderer.setSize(W, H, false);
      camera.aspect = W / H; camera.fov = 2 * Math.atan(H / 2 / F) * 180 / Math.PI; camera.updateProjectionMatrix();
      renderer.render(scene, camera);
    }
    s.raf = requestAnimationFrame(frame);
  })();
}

function showDbg(s) {           // ?debug=1 panel: what the QR tracking is doing on this phone
  if (!s.dbgEl) return;
  const d = s.dbg, v = s.video;
  s.dbgEl.textContent = [
    "3D libs: " + d.libs + "   reader: " + (s.detector ? "built-in + jsQR" : "jsQR"),
    "video: " + v.videoWidth + "x" + v.videoHeight + "   screen: " + innerWidth + "x" + innerHeight,
    "tries " + (d.tries || 0) + " · built-in saw " + (d.builtin || 0) + " · jsQR read " + (d.jsqr || 0),
    "poses " + (d.poses || 0) + " · rejected " + (d.rejected || 0) + (d.dist ? " · QR at " + d.dist : ""),
    "tilt from: " + (d.level || "-") + "   camera angle seen: " + (d.fov || "learning"),
    "state: " + (d.state || "") + (d.err ? "\nerror: " + d.err : "")].join("\n");
}

function stop() {
  const s = S; S = null;
  if (!s) return;
  if (s.dbgEl) s.dbgEl.remove();
  if (s.offGrav) s.offGrav();
  s.alive = false; clearTimeout(s.timer); cancelAnimationFrame(s.raf);
  s.canvas.classList.remove("on"); s.canvas.onpointerdown = s.canvas.onpointermove = s.canvas.onpointerup = s.canvas.onpointercancel = null;
  if (s.renderer) { s.renderer.clear(); s.renderer.dispose(); }
}

window.markerAR = { start, stop, _poseFrom: poseFrom, _session: () => S };   // _ = for testing
</script>
