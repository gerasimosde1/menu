<style>
/* Layout: same phone-sized "card table" as the GG love game: question card on top, four answer tiles, pass-the-phone curtains, a scoreboard strip. */
:root{
  --bg:#F7EEF6; --bg2:#EFDDEB; --card:#FFFFFF; --ink:#2B1530; --muted:#7A5C7E;
  --cherry:#E2335E; --cherry-ink:#FFFFFF; --tang:#FF9640; --line:#E6CFE0; --good:#1E9E6A; --miss:#C7354F;
  --show:"Luckiest Guy","Impact","Arial Black",sans-serif; --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B0F1F; --bg2:#2A1730; --card:#2B1A31; --ink:#F7E9F5; --muted:#C2A2C3;
  --cherry:#FF5A80; --cherry-ink:#24071A; --tang:#FFAA5E; --line:#45294D; --good:#4CD69B; --miss:#FF7A90; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B0F1F; --bg2:#2A1730; --card:#2B1A31; --ink:#F7E9F5; --muted:#C2A2C3;
  --cherry:#FF5A80; --cherry-ink:#24071A; --tang:#FFAA5E; --line:#45294D; --good:#4CD69B; --miss:#FF7A90; color-scheme:dark}
html,body{height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg) 70%);background-color:var(--bg);color:var(--ink);font:500 16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:460px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:16px;min-height:100%;box-sizing:border-box}
h1,h2{font-family:var(--show);font-weight:400;letter-spacing:.03em;text-wrap:balance;margin:0}
.logo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo .gg{font-family:var(--show);font-weight:400;letter-spacing:.04em;font-size:26px;color:var(--cherry);line-height:1}
.logo .gg small{color:var(--ink);font-size:15px;margin-left:6px}
.board{display:flex;gap:8px;align-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.pl{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--card);border:1.5px solid var(--line)}
.pl b{display:grid;place-items:center;min-width:26px;height:26px;border-radius:99px;padding:0 6px;box-sizing:border-box;font-size:14px}
.pl.a b{background:var(--cherry);color:var(--cherry-ink)} .pl.b b{background:var(--tang);color:#2B1530}
.pl.on{border-color:var(--ink)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px -18px rgba(120,20,70,.45)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--cherry) 14%,transparent);color:var(--cherry)}
.chip.lvl{background:var(--bg2);color:var(--muted)}
.q{font-family:var(--display);font-weight:700;font-size:clamp(23px,6.4vw,29px);line-height:1.15;margin:12px 0 6px;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;margin:0}
.answers{display:grid;gap:10px}
.ans{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:700;font-size:17px;cursor:pointer;transition:transform .12s,border-color .12s,opacity .2s}
.ans:hover{border-color:var(--cherry)}
.ans:active{transform:scale(.98)}
.ans:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
.ans .k{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--bg2);font-family:var(--show);padding-top:3px;box-sizing:border-box;color:var(--cherry);font-size:16px}
.ans.gone{opacity:.25;pointer-events:none;text-decoration:line-through}
.ans.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.ans.right .k{background:var(--good);color:var(--card)}
.ans.wrong{border-color:var(--miss);background:color-mix(in srgb,var(--miss) 10%,var(--card))}
.ans.wrong .k{background:var(--miss);color:var(--card)}
.ans.locked{cursor:default}
.ans .who{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.dot{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;color:var(--cherry-ink)}
.dot.a{background:var(--cherry)} .dot.b{background:var(--tang);color:#2B1530} .dot.t{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:10px;align-items:center}
.tools .timer{flex:1}
.timer{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cherry),var(--tang));border-radius:99px;transform-origin:left}
.timer.low i{background:var(--miss)}
.secs{font-weight:800;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right;color:var(--muted)}
.btn{all:unset;box-sizing:border-box;text-align:center;font-family:var(--show);font-weight:400;letter-spacing:.05em;font-size:20px;padding:15px 22px;border-radius:18px;background:var(--cherry);color:var(--cherry-ink);cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--cherry) 55%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--cherry) 55%,#000)}
.btn:focus-visible{outline:3px solid var(--tang);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-family:var(--body);font-weight:800;font-size:16px;padding:12px 18px}
.btn.mini{font-family:var(--body);font-weight:800;font-size:14px;padding:8px 14px;border-radius:99px;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
label,.lab{font-weight:800;font-size:14px;display:block;margin-bottom:6px}
input[type=text]{width:100%;box-sizing:border-box;font:700 17px var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
input[type=text]:focus{outline:none;border-color:var(--cherry)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{all:unset;cursor:pointer;font-weight:800;font-size:15px;padding:9px 14px;border-radius:99px;border:2px solid var(--line);background:var(--card)}
.opt[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
.modes{display:grid;gap:8px}
.mode{all:unset;cursor:pointer;box-sizing:border-box;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card)}
.mode b{display:block;font-size:16px}
.mode span{font-size:13px;color:var(--muted)}
.mode[aria-pressed=true]{border-color:var(--cherry);background:color-mix(in srgb,var(--cherry) 8%,var(--card))}
.mode:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
.curtain{min-height:58vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.curtain .big{font-family:var(--show);font-weight:400;letter-spacing:.02em;font-size:clamp(36px,11vw,52px);line-height:1.05;color:var(--cherry)}
.result{text-align:center;padding:4px 0}
.result .big{font-family:var(--show);font-weight:400;letter-spacing:.03em;font-size:32px;line-height:1.1}
.result.good .big{color:var(--good)} .result.miss .big{color:var(--miss)}
.final{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.winner{font-family:var(--show);font-weight:400;letter-spacing:.02em;font-size:clamp(34px,10vw,46px);line-height:1.05;color:var(--cherry)}
.bars{width:100%;display:grid;gap:10px;text-align:left}
.bars .lab{display:flex;justify-content:space-between;margin:0 0 4px;font-variant-numeric:tabular-nums}
.bar{width:100%;height:14px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .8s}
.bar.a i{background:var(--cherry)} .bar.b i{background:var(--tang)} .bar.t i{background:linear-gradient(90deg,var(--cherry),var(--tang))}
.progress{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--cherry);transition:width .3s}
.review{display:grid;gap:10px}
.rv{border-top:1.5px solid var(--line);padding-top:10px;font-size:14px}
.rv:first-child{border-top:0;padding-top:0}
.rv q{quotes:none;font-weight:800;display:block}
.rv .ok{color:var(--good);font-weight:800}
.sparks{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sparks span{position:absolute;bottom:-40px;color:var(--cherry);animation:up 2.2s ease-in forwards}
.sparks span:nth-child(2n){color:var(--tang)}
@keyframes up{to{transform:translateY(-110vh) rotate(35deg);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.small{font-size:13px;color:var(--muted)}
.ai{display:flex;flex-direction:column;gap:8px}
.room{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.code{font-family:var(--show);font-size:56px;letter-spacing:.18em;padding-left:.18em;line-height:1;color:var(--cherry)}
.qr{width:184px;height:184px;max-width:100%;background:#fff;border-radius:16px;padding:12px;box-sizing:border-box}
.qr svg{width:100%;height:100%;display:block}
.joined{font-weight:800;color:var(--good);margin:0;font-size:18px}
.err{color:var(--miss);font-weight:700}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--miss) 14%,var(--card));border:1.5px solid var(--miss);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px}
input.code-in{text-transform:uppercase;letter-spacing:.3em;font-family:var(--show)}
input:disabled{opacity:.65}
.ans.mine{border-color:var(--ink)}
.ans.watch{opacity:.7}
.linkish{all:unset;cursor:pointer;text-decoration:underline;color:var(--muted);font-weight:700}
.linkish:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
.foot{margin-top:auto;text-align:center;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const LS = "gg-quiz-night";
const store = {get(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}}, set(v){try{localStorage.setItem(LS,JSON.stringify(Object.assign(store.get(),v)))}catch(e){}}};
const saved = store.get();

let S = {
  screen:"intro", a:saved.a||"Gioia", b:saved.b||"Gerasimos", mode:saved.mode||"h2h",
  cats:saved.cats||Object.keys(CATS), diff:saved.diff||"mix", rounds:saved.rounds||10, timer:saved.timer??20, sound:saved.sound??true,
  online:false, gid:0, deck:[], i:0, phase:"first", picks:[null,null], fifty:[1,1], scores:[0,0], right:[0,0], streak:[0,0], hist:[], lastRes:[], extra:[]
};
// this phone only, never sent to the other phone
const L = { removed:[], tKey:"", code:"", myName:saved.me||"" };
// two phones: the phone that creates the game is player 1 (index 0) and runs the game; the one that joins is player 2 (index 1)
const NET = { role:null, me:0, peer:null, conn:null, code:"", open:false, connected:false, everConnected:false, err:"" };
const PEER_PREFIX = "ggquiznight-", CODE_ABC = "ABCDEFGHJKMNPQRSTUVWXYZ";

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const h = html => { app.innerHTML = html; };
const $ = id => document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const nameOf = p => p===0 ? S.a : S.b;
const cur = () => S.deck[S.i];
const pts = q => q.d;
const top0 = () => window.scrollTo(0,0);

// one phone: duel alternates per question; h2h first picker alternates, second is the other; team is shared (index 0 holds the team score)
function firstP(){ return S.i % 2; }
function activeP(){
  if(S.mode==="team") return 0;
  if(S.mode==="duel") return firstP();
  return S.phase==="second" ? 1-firstP() : firstP();
}

// ---------- sound ----------
let ac=null;
const soundOn = () => NET.role==="guest" ? (store.get().sound ?? true) : S.sound;
function beep(kind){
  if(!soundOn()) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const notes = kind==="good"?[660,880,1175]:kind==="bad"?[220,165]:kind==="win"?[523,659,784,1047]:[880];
    notes.forEach((f,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=kind==="bad"?"square":"triangle";o.frequency.value=f;
      const t=ac.currentTime+k*0.11;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+0.2);});
  }catch(e){}
}

// ---------- screen stays on during a game ----------
let wake=null;
async function keepAwake(){ try{ if(!wake && navigator.wakeLock){ wake=await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{wake=null;}); } }catch(e){} }
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  if(S.online||S.screen==="play") keepAwake();
  if(NET.role==="guest" && NET.everConnected && !NET.connected) reconnect();
});

// ---------- timer (keeps running across re-renders of the same question) ----------
let tHandle=null, tEnd=0;
function stopTimer(){ if(tHandle){cancelAnimationFrame(tHandle);tHandle=null;} }
function startTimer(onOut,key){
  stopTimer(); if(!S.timer) return;
  if(L.tKey!==key){ L.tKey=key; tEnd=performance.now()+S.timer*1000; }
  const bar=$("tbar"), secs=$("secs"), wrap=$("timer");
  const tick=()=>{
    const left=Math.max(0,tEnd-performance.now());
    if(bar) bar.style.transform=`scaleX(${left/(S.timer*1000)})`;
    if(secs) secs.textContent=Math.ceil(left/1000)+"s";
    if(wrap) wrap.classList.toggle("low",left<4000);
    if(left<=0){ tHandle=null; onOut(); return; }
    tHandle=requestAnimationFrame(tick);
  };
  tick();
}

// ---------- two phones (PeerJS: direct phone-to-phone link, codes go through the free PeerJS server) ----------
function netErr(e){
  if(["network","server-error","socket-error","socket-closed"].includes(e.type)) return "Couldn't reach the game server. Check your internet and try again.";
  if(e.type==="browser-incompatible") return "This browser can't play on two phones. Try Chrome or Safari.";
  return "The connection failed. Try again.";
}
function grabNames(){ const na=$("na"); if(na) S.a=na.value.trim()||S.a; }
function sync(){ if(NET.role==="host" && NET.conn && NET.conn.open){ try{ NET.conn.send({t:"state", s:{...S, extra:[]}}); }catch(e){} } }
function leaveOnline(){
  try{ NET.peer && NET.peer.destroy(); }catch(e){}
  Object.assign(NET,{role:null,me:0,peer:null,conn:null,code:"",open:false,connected:false,everConnected:false,err:""});
  S.online=false;
}

function host(){
  leaveOnline();
  NET.role="host"; NET.me=0; S.online=true; if(S.mode==="team") S.mode="h2h";
  NET.code = Array.from({length:4},()=>CODE_ABC[Math.random()*CODE_ABC.length|0]).join("");
  const peer = new Peer(PEER_PREFIX+NET.code.toLowerCase(), {debug:0}); NET.peer=peer;
  peer.on("open",()=>{ NET.open=true; NET.err=""; render(); });
  peer.on("connection",c=>{
    c.on("open",()=>{
      if(NET.conn && NET.conn!==c){ try{NET.conn.close()}catch(e){} }
      NET.conn=c; NET.connected=NET.everConnected=true; keepAwake();
      if(S.screen==="setup") grabNames();
      sync(); render();
    });
    c.on("data",m=>{ if(c===NET.conn) onHostData(m); });
    c.on("close",()=>{ if(c===NET.conn){ NET.connected=false; render(); } });
  });
  peer.on("disconnected",()=>{ try{ peer.reconnect(); }catch(e){} });
  peer.on("error",e=>{
    if(e.type==="unavailable-id"){ host(); return; }
    if(e.type==="peer-unavailable") return;
    NET.err=netErr(e); render();
  });
  S.screen="setup"; render();
}

function onHostData(m){
  if(!m || typeof m!=="object") return;
  if(m.t==="hello"){ grabNames(); S.b=String(m.name||"Player 2").slice(0,18); sync(); render(); }
  else if(m.t==="pick" && m.i===S.i) hostPick(1, [0,1,2,3,-1].includes(+m.k)?+m.k:-1);
  else if(m.t==="fifty" && m.i===S.i && S.fifty[1]>0){ S.fifty[1]--; sync(); }
  else if(m.t==="next" && m.i===S.i && S.phase==="reveal") next();
}

function join(code){
  leaveOnline();
  NET.role="guest"; NET.me=1; NET.code=code; S.online=true;
  const peer = new Peer({debug:0}); NET.peer=peer;
  peer.on("open",()=>connectToHost());
  peer.on("disconnected",()=>{ try{ peer.reconnect(); }catch(e){} });
  peer.on("error",e=>{
    NET.connected=false;
    NET.err = e.type==="peer-unavailable" ? `No game found with code ${code}. Check the code on the other phone, and keep that phone on the quiz.` : netErr(e);
    render();
  });
  render();
}
function connectToHost(){
  if(!NET.peer) return;
  const c = NET.peer.connect(PEER_PREFIX+NET.code.toLowerCase(), {reliable:true}); NET.conn=c;
  c.on("open",()=>{ NET.connected=NET.everConnected=true; NET.err=""; keepAwake(); c.send({t:"hello",name:L.myName}); render(); });
  c.on("data",m=>{ if(c===NET.conn) onGuestData(m); });
  c.on("close",()=>{ if(c===NET.conn){ NET.connected=false; render(); } });
}
function reconnect(){
  if(NET.role!=="guest") return;
  NET.err="";
  if(!NET.peer || NET.peer.destroyed) return join(NET.code);
  if(NET.peer.disconnected){ try{ NET.peer.reconnect(); }catch(e){} setTimeout(connectToHost,800); }
  else connectToHost();
  render();
}

function onGuestData(m){
  if(!m || m.t!=="state" || !m.s) return;
  const prev = {i:S.i, phase:S.phase, screen:S.screen, gid:S.gid};
  Object.assign(S, m.s);
  const moved = S.i!==prev.i || S.screen!==prev.screen || S.gid!==prev.gid;
  if(moved) L.removed=[];
  render();
  if(moved) top0();
  if(S.screen==="play" && S.phase==="reveal" && !(prev.phase==="reveal" && prev.i===S.i && prev.gid===S.gid)){ top0(); roundFx(); }
  if(S.screen==="end" && prev.screen!=="end") endFx();
}

// ---------- screens ----------
function header(){
  const playing = S.screen==="play";
  let right;
  if(playing && S.mode==="team") right=`<div class="board"><span class="pl a on"><b>${S.scores[0]}</b>Team</span></div>`;
  else if(playing){
    const ap = S.online ? (S.mode==="duel" ? S.i%2 : -1) : activeP();
    right=`<div class="board">${[0,1].map(p=>`<span class="pl ${p?"b":"a"} ${ap===p&&S.phase!=="reveal"?"on":""}"><b>${S.scores[p]}</b>${esc(nameOf(p))}</span>`).join("")}</div>`;
  }
  else right=`<div class="small" style="font-weight:800">${esc(S.a)} &amp; ${esc(S.b)}</div>`;
  const lost = S.online && NET.everConnected && !NET.connected && (S.screen==="play"||S.screen==="end");
  return `<div class="logo"><div class="gg">GG<small>quiz night</small></div>${right}</div>
  ${lost?`<div class="banner" role="status"><span>${NET.err?esc(NET.err):`Lost the connection to ${esc(nameOf(1-NET.me))}'s phone.`}</span>${NET.role==="guest"?`<button class="btn mini" id="recon">Reconnect</button>`:`<span class="small">Waiting for them to come back…</span>`}</div>`:""}
  ${playing?`<div class="progress" aria-hidden="true"><i style="width:${(S.i/S.deck.length*100).toFixed(1)}%"></i></div>`:""}`;
}

function render(){
  stopTimer();
  if(NET.role==="guest" && S.screen!=="play" && S.screen!=="end") renderGuestWait();
  else if(S.screen==="intro") renderIntro();
  else if(S.screen==="online") renderOnline();
  else if(S.screen==="setup") renderSetup();
  else if(S.screen==="play") renderPlay();
  else if(S.screen==="end") renderEnd();
  const rc=$("recon"); if(rc) rc.onclick=reconnect;
}

  let big, sub, btn="";
  if(NET.err){ big="Couldn't join"; sub=esc(NET.err); btn=`<button class="btn" id="gback">Try again</button>`; }

  else { big=`You're in, ${esc(L.myName)}!`; sub=`${esc(S.a)} is choosing the settings. The game starts on both phones at once.`; }
  h(`${header()}<div class="curtain"><div class="eyebrow">Two phones</div><div class="big">${big}</div>

  $("gleave").onclick=()=>{ leaveOnline(); S.screen="intro"; render(); };
}

function pool(){
  const lv = {easy:[1],medium:[2],hard:[3],mix:[1,2,3]}[S.diff];
  return [...S.extra, ...BANK].filter(q=>S.cats.includes(q.c)&&lv.includes(q.d));
}

function modeSub(k){
  if(S.online && k==="h2h") return "Same question on both phones. Answer at the same time, then reveal.";
  if(S.online && k==="duel") return "Your own questions, one at a time. The other phone watches.";
  return MODES[k].sub;
}

    <div class="row">
      <div><label for="na">${S.online?"You":"Player 1"}</label><input type="text" id="na" value="${esc(S.a)}" maxlength="18"></div>
      <div><label for="nb">Player 2</label><input type="text" id="nb" value="${esc(S.online?(NET.connected?S.b:"Waiting…"):S.b)}" maxlength="18" ${S.online?"disabled":""}></div>
    </div>
    <div><span class="lab">Mode</span><div class="modes" id="mode">${modes.map(k=>`<button class="mode" data-v="${k}" aria-pressed="${S.mode===k}"><b>${MODES[k].name}</b><span>${modeSub(k)}</span></button>`).join("")}</div></div>
    <div><span class="lab">Categories</span><div class="opts" id="cats">${Object.entries(CATS).map(([k,v])=>`<button class="opt" data-v="${k}" aria-pressed="${S.cats.includes(k)}">${v}</button>`).join("")}
      <button class="opt" data-v="__all" aria-pressed="false">All</button></div></div>
    <div><span class="lab">Difficulty</span>${opt("diff",[["mix","Mixed"],["easy","Easy"],["medium","Medium"],["hard","Hard"]],S.diff)}</div>
    <div><span class="lab">Questions</span>${opt("rounds",[[10,"10"],[16,"16"],[24,"24"],[0,"All"]],S.rounds)}</div>
    <div><span class="lab">Timer per answer</span>${opt("timer",[[0,"Off"],[10,"10s"],[20,"20s"],[30,"30s"]],S.timer)}</div>
    <div><span class="lab">Sounds</span>${opt("sound",[["true","On"],["false","Off"]],S.sound)}</div>
    <div class="small" id="count"></div>
    <button class="btn" id="start">Start</button>
  </div>
  <div class="card ai" id="aibox" hidden>
    <div class="eyebrow">Fresh questions</div>
    <p class="hint">Played them all? Ask Claude for 10 brand-new questions in your categories and difficulty.</p>
    <button class="btn ghost" id="gen">Write new questions</button>
    <div class="small" id="aimsg" role="status"></div>
  </div>
  <div class="foot">Each player gets one 50:50 per game. Questions you have already seen come last.${S.online?`<br><button class="linkish" id="leave">Stop the two-phone game</button>`:""}</div>`);
  const upd = ()=>{
    const n=pool().length;
    $("count").textContent = n+" questions match"+(S.extra.length?` (incl. ${S.extra.length} new from Claude)`:"")+(n<4?". Pick more categories.":"");
    const wait = S.online && !NET.connected;
    $("start").disabled = n<2 || wait; $("start").textContent = wait ? "Waiting for player 2" : "Start";
  };
  upd();
  const press = (id,fn)=>{$(id).onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;fn(b.dataset.v);
    $(id).querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===b.dataset.v)));upd();};};
  press("mode",v=>S.mode=v); press("diff",v=>S.diff=v); press("rounds",v=>S.rounds=+v); press("timer",v=>S.timer=+v);
  press("sound",v=>{S.sound=v==="true"; if(S.sound) beep("tick");});
  $("cats").onclick = e=>{const b=e.target.closest("[data-v]");if(!b)return;const k=b.dataset.v;
    if(k==="__all") S.cats = S.cats.length===Object.keys(CATS).length ? [Object.keys(CATS)[0]] : Object.keys(CATS);
    else { S.cats = S.cats.includes(k)? S.cats.filter(x=>x!==k) : [...S.cats,k]; if(!S.cats.length) S.cats=[k]; }
    $("cats").querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v==="__all"?"false":String(S.cats.includes(x.dataset.v)))); upd(); };
  $("start").onclick = start;
  const qrBox=$("qr");
  if(qrBox && typeof qrcode!=="undefined"){ const qr=qrcode(0,"M"); qr.addData(joinUrl); qr.make(); qrBox.innerHTML=qr.createSvgTag({cellSize:4,margin:0,scalable:true}); }
  const rt=$("retry"); if(rt) rt.onclick=()=>host();
  const lv=$("leave"); if(lv) lv.onclick=()=>{ grabNames(); leaveOnline(); S.screen="intro"; render(); };
  setupAI();
}

function start(){
  if(NET.role==="guest") return;
  const na=$("na"), nb=$("nb");
  if(na){ S.a = na.value.trim()||"Player 1"; if(!S.online) S.b = nb.value.trim()||"Player 2"; }
  store.set(Object.assign({a:S.a,mode:S.mode,cats:S.cats,diff:S.diff,rounds:S.rounds,timer:S.timer,sound:S.sound}, S.online?{}:{b:S.b}));
  const seen = new Set(store.get().seen||[]);
  const p = pool();
  const fresh = shuffle(p.filter(q=>!seen.has(q.id))), old = shuffle(p.filter(q=>seen.has(q.id)));
  // Claude's new questions first, then unseen, then repeats
  let deck = [...fresh.filter(q=>q.id[0]==="x"), ...fresh.filter(q=>q.id[0]!=="x"), ...old];
  let n = S.rounds || deck.length;
  if(S.mode!=="team" && n%2) n--; // equal turns
  deck = shuffle(deck.slice(0, Math.max(2,Math.min(n,deck.length - (S.mode!=="team"&&deck.length%2?1:0)))));
  S.deck = deck.map(q=>{ const order=shuffle([0,1,2,3]); return {...q, opts:order.map(k=>q.a[k]), ok:order.indexOf(0)}; });
  S.gid=Date.now(); S.i=0; S.phase=S.online?"ask":"first"; S.picks=[null,null]; S.fifty=S.mode==="team"?[2,0]:[1,1]; L.removed=[];
  S.scores=[0,0]; S.right=[0,0]; S.streak=[0,0]; S.hist=[]; S.lastRes=[];
  S.screen="play"; keepAwake(); render(); top0(); sync();
}

function answerTiles(q, tileClass, tagsFor){
  return `<div class="answers" id="ans">${q.opts.map((t,k)=>`<button class="ans ${tileClass(k)}" data-k="${k}" ${/locked|gone/.test(tileClass(k))?'tabindex="-1"':""}>
    <span class="k">${"ABCD"[k]}</span><span>${esc(t)}</span>${tagsFor(k)}</button>`).join("")}</div>`;
}
// picks by player: [player 1's pick, player 2's pick]
function revealTiles(q, byPlayer){
  return answerTiles(q, k=>{
    const mine = S.mode==="team" ? byPlayer[0]===k : (byPlayer[0]===k||byPlayer[1]===k);
    return k===q.ok ? "right locked" : mine ? "wrong locked" : "locked";
  }, k=>{
    const tags=[];
    if(S.mode==="team"){ if(byPlayer[0]===k) tags.push(`<span class="dot t">Team</span>`); }
    else { if(byPlayer[0]===k) tags.push(`<span class="dot a">${esc(S.a)}</span>`); if(byPlayer[1]===k) tags.push(`<span class="dot b">${esc(S.b)}</span>`); }
    return tags.length?`<span class="who">${tags.join("")}</span>`:"";
  });
}
function questionCard(q, hint){
  return `<div class="card" id="qcard">
    <div class="chips"><span class="chip">${CATS[q.c]||"Bonus"}</span><span class="chip lvl">${LEVEL[q.d]} · ${pts(q)} pt${pts(q)>1?"s":""}</span></div>
    <div class="q">${esc(q.q)}</div>
    <p class="hint">${hint}</p>
  </div>`;
}
function toolsRow(fiftyLeft){
  return `<div class="tools">
     ${S.timer?`<div class="timer" id="timer"><i id="tbar"></i></div><span class="secs" id="secs">${S.timer}s</span>`:`<div style="flex:1"></div>`}
     <button class="btn mini" id="fifty" ${fiftyLeft&&!L.removed.length?"":"disabled"}>50:50${S.mode==="team"?` ×${fiftyLeft}`:""}</button>
   </div>`;
}
function useFifty(q){ L.removed = shuffle([0,1,2,3].filter(k=>k!==q.ok)).slice(0,2); }

function renderPlay(){
  if(S.online) return renderOnlinePlay();
  const q = cur(), fp = firstP(), ap = activeP();
  if(S.phase==="pass"){
    h(`${header()}<div class="curtain">
      <div class="eyebrow">No peeking</div>
      <div class="big">Pass the phone to ${esc(nameOf(1-fp))}</div>
      <p class="hint">${esc(nameOf(fp))} has locked in an answer.</p>
      <button class="btn" id="ready">I'm ${esc(nameOf(1-fp))}, ready</button></div>`);
    $("ready").onclick=()=>{S.phase="second";L.removed=[];render();};
    return;
  }
  const reveal = S.phase==="reveal";
  let who;
  if(S.mode==="team") who = "Answer together";
  else if(S.mode==="duel") who = `<b style="color:var(--ink)">${esc(nameOf(ap))}</b>'s question`;
  else who = `<b style="color:var(--ink)">${esc(nameOf(ap))}</b>, answer secretly`;
  const fiftyLeft = S.mode==="team" ? S.fifty[0] : S.fifty[ap];
  const byPlayer = S.mode==="duel" ? (fp===0?[S.picks[0],null]:[null,S.picks[0]]) : S.mode==="team" ? [S.picks[0],null] : (fp===0?[S.picks[0],S.picks[1]]:[S.picks[1],S.picks[0]]);
  h(`${header()}
  ${questionCard(q, reveal ? `Question ${S.i+1} of ${S.deck.length}` : who)}
  ${reveal ? revealTiles(q, byPlayer) : toolsRow(fiftyLeft) + answerTiles(q, k=>L.removed.includes(k)?"gone":"", ()=>"")}
  ${reveal?revealBlock(q):""}`);
  if(!reveal){
    $("ans").onclick = e=>{ const b=e.target.closest(".ans"); if(!b||b.classList.contains("gone")) return; choose(+b.dataset.k); };
    $("fifty").onclick = ()=>{ useFifty(q); if(S.mode==="team") S.fifty[0]--; else S.fifty[ap]--; render(); };
    startTimer(()=>choose(-1), `${S.gid}-${S.i}-${S.phase}`);
  } else $("next").onclick = next;
}

function renderOnlinePlay(){
  const q=cur(), me=NET.me, other=1-me, reveal=S.phase==="reveal";
  const duel=S.mode==="duel", active=duel?S.i%2:me, myTurn=!duel||active===me;
  const mine=S.picks[me], canAnswer=!reveal && myTurn && mine==null;
  const B = s => `<b style="color:var(--ink)">${esc(s)}</b>`;
  let hint;
  if(reveal) hint=`Question ${S.i+1} of ${S.deck.length}`;
  else if(duel) hint = !myTurn ? `${B(nameOf(active))} is answering…` : mine==null ? "Your question" : "Locked in";
  else hint = mine!=null ? `Locked in. Waiting for ${B(nameOf(other))}…` : S.picks[other]!=null ? `${B(nameOf(other))} has answered. Your turn!` : "Answer on your phone";
  const tiles = reveal ? revealTiles(q, S.picks)
    : answerTiles(q, k=> canAnswer ? (L.removed.includes(k)?"gone":"") : "locked"+(mine===k?" mine":"")+(myTurn?"":" watch"), k=> mine===k?`<span class="who"><span class="dot ${me?"b":"a"}">Locked</span></span>`:"");
  h(`${header()}
  ${questionCard(q, hint)}
  ${canAnswer ? toolsRow(S.fifty[me]) : ""}
  ${tiles}
  ${reveal?revealBlock(q):""}`);
  if(canAnswer){
    $("ans").onclick = e=>{ const b=e.target.closest(".ans"); if(!b||b.classList.contains("gone")) return; choose(+b.dataset.k); };
    $("fifty").onclick = ()=>{
      useFifty(q); S.fifty[me]--;
      if(NET.role==="guest"){ try{ NET.conn.send({t:"fifty",i:S.i}); }catch(e){} } else sync();
      render();
    };
    startTimer(()=>choose(-1), `${S.gid}-${S.i}-${me}`);
  }
  if(reveal) $("next").onclick = next;
}

function revealBlock(q){
  const ans = esc(q.opts[q.ok]);
  let big, sub, good;
  const res = S.lastRes;
  if(S.mode==="h2h"){
    const okA = res.find(r=>r.p===0).ok, okB = res.find(r=>r.p===1).ok;
    good = okA||okB;
    big = okA&&okB ? "Both right!" : okA ? `Point to ${esc(S.a)}` : okB ? `Point to ${esc(S.b)}` : "Both wrong!";
    sub = okA&&okB ? `+${pts(q)} each.` : good ? `+${pts(q)}. The answer was ${ans}.` : `It was ${ans}.`;
  } else {
    const r = res[0]; good = r.ok;
    const nm = S.mode==="team" ? "Team" : esc(nameOf(r.p));
    big = r.ok ? (S.streak[r.p]>=3 ? `${S.streak[r.p]} in a row!` : "Correct!") : r.timeout ? "Time's up!" : "Not quite";
    sub = r.ok ? `+${pts(q)} for ${nm}.` : `It was ${ans}.`;
  }
  return `<div class="result ${good?"good":"miss"}"><div class="big">${big}</div><p class="hint">${sub}</p></div>
    <button class="btn" id="next">${S.i+1<S.deck.length?"Next question":"See the winner"}</button>`;
}

function scoreRound(takers){
  const q = cur();
  S.lastRes = takers.map(([p,pick])=>{
    const ok = pick===q.ok;
    if(ok){ S.scores[p]+=pts(q); S.right[p]++; S.streak[p]++; } else S.streak[p]=0;
    return {p, ok, timeout: pick===-1};
  });
  S.hist.push({q:q.q, ans:q.opts[q.ok], c:q.c, res:S.lastRes.map(r=>({p:r.p,ok:r.ok}))});
  const seen = store.get().seen||[]; if(!seen.includes(q.id)) store.set({seen:[...seen,q.id].slice(-400)});
}
function roundFx(){
  const mineRes = S.online ? (S.lastRes.find(r=>r.p===NET.me) || S.lastRes[0]) : null;
  const good = mineRes ? mineRes.ok : S.lastRes.some(r=>r.ok);
  if(good){ beep("good"); sparks(S.lastRes.every(r=>r.ok)?16:10); } else { beep("bad"); $("qcard")?.classList.add("shake"); }
}
function endFx(){ beep("win"); sparks(26); }

function hostPick(p,k){
  if(S.screen!=="play" || S.phase==="reveal" || S.picks[p]!=null) return;
  if(S.mode==="duel" && S.i%2!==p) return;
  S.picks[p]=k;
  const need = S.mode==="duel" ? [S.i%2] : [0,1];
  const done = need.every(x=>S.picks[x]!=null);
  if(done){ scoreRound(need.map(x=>[x,S.picks[x]])); S.phase="reveal"; }
  sync(); render();
  if(done){ top0(); roundFx(); }
}

function choose(k){
  stopTimer();
  if(S.online){
    if(S.screen!=="play" || S.phase==="reveal" || S.picks[NET.me]!=null) return;
    if(S.mode==="duel" && S.i%2!==NET.me) return;
    if(NET.role==="host") return hostPick(0,k);
    S.picks[1]=k; try{ NET.conn.send({t:"pick",i:S.i,k}); }catch(e){}
    render(); return;
  }
  const fp = firstP();
  if(S.mode==="h2h" && S.phase==="first"){ S.picks[0]=k; S.phase="pass"; render(); top0(); return; }
  if(S.mode==="h2h") S.picks[1]=k; else S.picks[0]=k;
  scoreRound(S.mode==="h2h" ? [[fp,S.picks[0]],[1-fp,S.picks[1]]] : [[S.mode==="team"?0:fp,S.picks[0]]]);
  S.phase="reveal"; render(); top0(); roundFx();
}

function next(){
  if(S.online && NET.role==="guest"){ try{ NET.conn.send({t:"next",i:S.i}); }catch(e){} return; }
  S.i++; S.picks=[null,null]; L.removed=[]; S.phase=S.online?"ask":"first";
  if(S.i>=S.deck.length) S.screen="end";
  sync(); render(); top0();
  if(S.screen==="end") endFx();
}

function renderEnd(){
  const n = S.hist.length;
  let head, sub, bars;
  if(S.mode==="team"){
    const max = S.deck.reduce((s,q)=>s+pts(q),0), p = max?Math.round(S.scores[0]/max*100):0;
    head = p>=85?"Genius couple":p>=65?"Big brains":p>=45?"Solid team":p>=25?"Getting there":"Pub quiz rookies";
    sub = `${S.right[0]} of ${n} right · ${S.scores[0]} of ${max} points`;
    bars = `<div><div class="lab"><span>Team</span><span>${p}%</span></div><div class="bar t"><i style="width:${p}%"></i></div></div>`;
  } else {
    const [x,y]=S.scores, top=Math.max(x,y,1);
    head = x===y ? "It's a tie!" : `${esc(x>y?S.a:S.b)} wins!`;
    const per = S.mode==="duel" ? n/2 : n;
    sub = x===y ? "Rematch to settle it?" : `${esc(x>y?S.b:S.a)} wants a rematch.`;
    bars = [0,1].map(p=>`<div><div class="lab"><span>${esc(nameOf(p))}</span><span>${S.scores[p]} pts · ${S.right[p]}/${per} right</span></div>
      <div class="bar ${p?"b":"a"}"><i style="width:${(S.scores[p]/top*100).toFixed(0)}%"></i></div></div>`).join("");
  }
  const missed = S.hist.filter(r=>r.res.some(x=>!x.ok));
  const guest = NET.role==="guest";
  h(`${header()}
  <div class="card final">
    <div class="eyebrow">${MODES[S.mode].name} · ${n} questions</div>
    <div class="winner">${head}</div>
    <p class="hint" style="font-size:16px">${sub}</p>
    <div class="bars">${bars}</div>
    ${guest ? `<p class="hint">Waiting for ${esc(S.a)} to start the rematch…</p>`
            : `<div class="row" style="width:100%"><button class="btn" id="again">Play again</button><button class="btn ghost" id="setup">Settings</button></div>`}
  </div>
  ${missed.length?`<div class="card"><div class="eyebrow" style="margin-bottom:10px">Learn the answers you missed</div><div class="review">
    ${missed.map(r=>`<div class="rv"><q>${esc(r.q)}</q><span class="ok">${esc(r.ans)}</span>${S.mode==="team"?"":` <span class="small">· missed by ${r.res.filter(x=>!x.ok).map(x=>esc(nameOf(x.p))).join(" & ")}</span>`}</div>`).join("")}
  </div></div>`:""}`);
  if(!guest){
    $("again").onclick=start;
    $("setup").onclick=()=>{ S.screen="setup"; sync(); render(); top0(); };
  }
}

function sparks(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box=$("sparks");
  for(let i=0;i<n;i++){const s=document.createElement("span");s.textContent=i%3?"★":"♥";
    s.style.left=Math.random()*100+"%";s.style.animationDelay=(Math.random()*.7)+"s";s.style.fontSize=(14+Math.random()*22)+"px";
    box.appendChild(s);setTimeout(()=>s.remove(),3200);}
}

// keyboard: 1-4 or A-D to answer, Enter for next
document.addEventListener("keydown",e=>{
  if(S.screen!=="play"||e.target.tagName==="INPUT") return;
  if(S.phase==="reveal"&&e.key==="Enter"){ $("next")?.click(); return; }
  const k = "1234".indexOf(e.key)>=0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
  if(k>=0 && S.phase!=="reveal" && S.phase!=="pass" && !L.removed.includes(k) && $("ans") && !$("ans").querySelector(".locked")) choose(k);
});

// Optional: Claude writes new questions (only where this viewer can use Claude)
let samplePromise = window.claude?.use ? window.claude.use("sample").catch(()=>null) : Promise.resolve(null);
async function setupAI(){
  const sample = await samplePromise; const box=$("aibox"); if(!sample||!box) return;
  box.hidden=false;
  const btn=$("gen"), msg=$("aimsg");
  btn.onclick = async ()=>{
    btn.disabled=true; msg.textContent="Claude is writing questions…";
    const cats = S.cats.map(k=>`${k} (${CATS[k]})`).join(", ");
    const lv = {easy:"all easy (1)",medium:"all medium (2)",hard:"all hard (3)",mix:"a mix of easy (1), medium (2) and hard (3)"}[S.diff];
    const prompt = `Write 10 new general-knowledge quiz questions for a couple's quiz night. Spread them across these categories (use the key): ${cats}. Difficulty: ${lv}.
Every question must have one clearly correct, well-established, non-controversial answer that will not change over time. Avoid "as of" facts, records likely to be broken, and trick questions. Double-check each fact.
Each question has exactly 4 short answers (max 6 words each); the FIRST answer is the correct one, the other three are plausible but clearly wrong.
Avoid these existing questions: ${shuffle(BANK).slice(0,50).map(q=>q.q).join(" | ")}.
Reply with only a JSON array like [{"c":"geo","d":2,"q":"...","a":["correct","wrong","wrong","wrong"]}].`;
    try{
      const arr = await sample.json(prompt,{cache:false});
      const ok = (Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.q==="string"&&Array.isArray(x.a)&&x.a.length===4&&CATS[x.c]&&[1,2,3].includes(+x.d)&&new Set(x.a.map(String)).size===4)
        .map((x,j)=>({id:"x"+Date.now().toString(36)+j,c:x.c,d:+x.d,q:String(x.q).slice(0,160),a:x.a.map(s=>String(s).slice(0,60))}));
      S.extra = [...ok, ...S.extra];
      msg.textContent = ok.length? `Added ${ok.length} new questions. They come first in your next game.` : "That didn't work. Try again.";
      const c=$("count"); if(c) c.textContent = pool().length+` questions match (incl. ${S.extra.length} new from Claude)`;
    }catch(e){
      if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code)){ box.hidden=true; return; }
      msg.textContent = e?.code==="rate_limited" ? "Too many requests. Try again in a minute." : "That didn't work. Try again.";
    }finally{ btn.disabled=false; }
  };
}

// a join link (…/quiz/#ABCD) opens straight on the join form with the code filled in
const hashCode = location.hash.slice(1).toUpperCase();
if(/^[A-Z]{4}$/.test(hashCode)){ L.code=hashCode; S.screen="online"; }

// keep the game going when the page updates while open (one-phone games only)
window.claude?.hot?.snapshot?.(()=>S.online?null:S);
function boot(data){ if(data && data.screen && !data.online) S = Object.assign(S,data); render(); }
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body></html>
